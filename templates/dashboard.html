<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warte · control tower</title>
  <!-- htmx 2.0.4, vendored (0BSD): no CDN, works on an offline LAN -->
  <script src="htmx.min.js"></script>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body data-idle='{{IDLE}}'>
  <header class="header">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="#1d7f93"/><circle cx="13" cy="13" r="6" fill="none" stroke="#1d7f93"/><g class="sweep"><path d="M13 13 L13 1 A12 12 0 0 1 24 9 Z" fill="#3ee6ff" opacity=".45"/><line x1="13" y1="13" x2="13" y2="1" stroke="#3ee6ff" stroke-width="1.5"/></g><circle cx="18" cy="7" r="1.6" fill="#ffb84d"/></svg>
      <h1>warte</h1>
      <span class="subtitle">control tower</span>
    </div>
    <nav class="nav">
      <button hx-get="api/dashboard/overview-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn active">Overview</button>
      <button hx-get="api/dashboard/airport-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Airport</button>
      <button hx-get="api/dashboard/machines-partial" hx-vals="js:{range: warteRange(), open: warteOpen()}" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Machines</button>
      <button hx-get="api/dashboard/jobs-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Jobs</button>
      <button hx-get="api/dashboard/compliance-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Compliance</button>
      <button hx-get="api/dashboard/ask-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Ask</button>
      <button hx-get="api/dashboard/queue-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Queue</button>
      <button hx-get="api/dashboard/ci-history-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>CI history</button>
      <button hx-get="api/dashboard/critical-path-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Critical Path</button>
      <button hx-get="api/dashboard/resources-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Resources</button>
      <button hx-get="api/dashboard/outages-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Outages</button>
      <button hx-get="api/dashboard/friction-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Friction</button>
      <button hx-get="api/dashboard/schedule-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Schedule</button>
      <button hx-get="api/dashboard/costs-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Costs</button>
      <button hx-get="api/dashboard/skills-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Skills</button>
      <button hx-get="api/dashboard/health-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Health</button>
      <button hx-get="api/dashboard/agents-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Agents</button>
      <button hx-get="api/dashboard/artifacts-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Artifacts</button>
    </nav>
    <span class="clock" title="tower time">UTC <b id="utc">--:--:--</b></span>
  </header>

  <main id="content">
    <p class="loading">Loading...</p>
  </main>

  <footer class="footer">
    <span>warte v{{VERSION}}</span>
    <span id="refresh-status" class="sse-status">refreshes every 30 s</span>
  </footer>

  <script>
    // The Machines view's history range, remembered per viewer when the
    // browser lets us (REQ-MHIST-003); 24 h otherwise.
    function warteRange() {
      try { return localStorage.getItem('warte.range') || '24h'; } catch (e) { return '24h'; }
    }
    function warteSetRange(r) {
      try { localStorage.setItem('warte.range', r); } catch (e) {}
      warteHash();
    }
    // Machine histories the viewer has open: sent with every refresh so the
    // server renders them open, and kept in the address
    // (#machines/<host>?range=7d), so a reload or a shared link opens them.
    var warteOpenHosts = [];
    (function () {
      var m = /^#machines\/([^?]+)(?:\?range=([0-9a-z]+))?$/.exec(location.hash);
      if (m) {
        try { warteOpenHosts.push(decodeURIComponent(m[1])); } catch (e) {}
        if (m[2]) { try { localStorage.setItem('warte.range', m[2]); } catch (e) {} }
      }
    })();
    function warteOpen() { return warteOpenHosts.join(','); }
    function warteHash() {
      if (location.hash.split(/[\/?]/)[0] !== '#machines') return;
      var h = '#machines';
      if (warteOpenHosts.length) {
        h += '/' + encodeURIComponent(warteOpenHosts[warteOpenHosts.length - 1]) + '?range=' + warteRange();
      }
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    // toggle does not bubble: listen in the capture phase
    document.addEventListener('toggle', function (e) {
      var d = e.target;
      if (!d.matches || !d.matches('details.mhist') || !d.dataset.host) return;
      var host = d.dataset.host;
      warteOpenHosts = warteOpenHosts.filter(function (x) { return x !== host; });
      if (d.open) warteOpenHosts.push(host);
      warteHash();
    }, true);
  </script>
  <script>
    // Active nav button, and a periodic refresh of the current view. Live push
    // (warte watch / long-poll, v1.4.1) replaces the timer later. Ask is not
    // reloaded whole: it would wipe what you typed; its answer and in-flight
    // list refresh on their own (#ask-live).
    // The view lives in the URL (#machines, #queue, ...): a reload, a bookmark
    // or a shared link opens that view, and back/forward move between views.
    var buttons = Array.prototype.slice.call(document.querySelectorAll('.nav-btn'));
    var current = buttons[0];
    function slug(btn) { return '#' + btn.textContent.trim().toLowerCase().replace(/\s+/g, '-'); }
    function fromHash() {
      var view = location.hash.split(/[\/?]/)[0];
      return buttons.find(function (b) { return slug(b) === view; }) || buttons[0];
    }
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        current = btn;
        if (location.hash.split(/[\/?]/)[0] !== slug(btn)) history.pushState(null, '', slug(btn));
      });
    });
    window.addEventListener('popstate', function () { htmx.trigger(fromHash(), 'click'); });
    // after htmx has processed the page (its listener was registered first)
    document.addEventListener('DOMContentLoaded', function () { htmx.trigger(fromHash(), 'click'); });
    // Tower clock: UTC, like the timestamps everywhere else.
    var utc = document.getElementById('utc');
    function tick() { utc.textContent = new Date().toISOString().slice(11, 19); }
    tick();
    setInterval(tick, 1000);
    setInterval(function () {
      if (current && !current.hasAttribute('data-no-refresh') && !document.hidden) {
        htmx.trigger(current, 'click');
      }
    }, 30000);
  </script>
  <script src="idle.js" defer></script>
</body>
</html>
