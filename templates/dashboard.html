<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warte · control tower</title>
  <!-- htmx 2.0.4, vendored (0BSD): no CDN, works on an offline LAN -->
  <script src="htmx.min.js"></script>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body data-idle='{{IDLE}}'>
  <header class="header">{{NAV}}
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="none" stroke="#1d7f93"/><circle cx="13" cy="13" r="6" fill="none" stroke="#1d7f93"/><g class="sweep"><path d="M13 13 L13 1 A12 12 0 0 1 24 9 Z" fill="#3ee6ff" opacity=".45"/><line x1="13" y1="13" x2="13" y2="1" stroke="#3ee6ff" stroke-width="1.5"/></g><circle cx="18" cy="7" r="1.6" fill="#ffb84d"/></svg>
      <h1>warte</h1>
      <span class="subtitle">control tower</span>
    </div>
    <!-- REQ-DASH-019: five groups; the open group's views form the second row -->
    <nav class="nav-groups" aria-label="Groups">
      <button class="nav-group active" data-group="now">Now<span class="nav-badge" aria-hidden="true" hidden></span></button>
      <button class="nav-group" data-group="ci">CI<span class="nav-badge" aria-hidden="true" hidden></span></button>
      <button class="nav-group" data-group="machines">Machines<span class="nav-badge" aria-hidden="true" hidden></span></button>
      <button class="nav-group" data-group="agents">Agents<span class="nav-badge" aria-hidden="true" hidden></span></button>
      <button class="nav-group" data-group="compliance">Compliance<span class="nav-badge" aria-hidden="true" hidden></span></button>
    </nav>
    <nav class="nav nav-views" data-group="now" aria-label="Now">
      <button hx-get="api/dashboard/north-star-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">North Star</button>
      <button hx-get="api/dashboard/overview-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn active" data-default>Overview</button>
      <button hx-get="api/dashboard/outages-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Outages</button>
      <button hx-get="api/dashboard/briefing-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Briefing</button>
    </nav>
    <nav class="nav nav-views" data-group="ci" aria-label="CI" hidden>
      <button hx-get="api/dashboard/queue-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Queue</button>
      <button hx-get="api/dashboard/reviews-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Reviews</button>
      <button hx-get="api/dashboard/airport-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Airport</button>
      <button hx-get="api/dashboard/ci-history-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>CI history</button>
      <button hx-get="api/dashboard/critical-path-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Critical Path</button>
      <button hx-get="api/dashboard/jobs-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Jobs</button>
      <button hx-get="api/dashboard/resources-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Resources</button>
      <button hx-get="api/dashboard/schedule-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Schedule</button>
      <button hx-get="api/dashboard/ask-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Ask</button>
    </nav>
    <nav class="nav nav-views" data-group="machines" aria-label="Machines" hidden>
      <button hx-get="api/dashboard/machines-partial" hx-vals="js:{range: warteRange(), open: warteOpen()}" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Machines</button>
      <button hx-get="api/dashboard/health-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Health</button>
      <button hx-get="api/dashboard/architecture-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Architecture</button>
      <button hx-get="api/dashboard/security-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Security</button>
    </nav>
    <nav class="nav nav-views" data-group="agents" aria-label="Agents" hidden>
      <button hx-get="api/dashboard/agents-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Agents</button>
      <button hx-get="api/dashboard/decisions-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn" data-no-refresh>Decisions</button>
      <button hx-get="api/dashboard/costs-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Costs</button>
      <button hx-get="api/dashboard/skills-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Skills</button>
      <button hx-get="api/dashboard/friction-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Friction</button>
      <button hx-get="api/dashboard/artifacts-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Artifacts</button>
    </nav>
    <nav class="nav nav-views" data-group="compliance" aria-label="Compliance" hidden>
      <button hx-get="api/dashboard/compliance-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Compliance</button>
      <button hx-get="api/dashboard/seams-partial" hx-target="#content" hx-swap="innerHTML" class="nav-btn">Seams</button>
    </nav>
    <p class="nav-hidden-note" id="nav-hidden-note" hidden></p>
    <!-- REQ-DASH-020: only when something waits for the owner -->
    <div class="attention" id="attention" role="region" aria-label="Needs your attention" hidden><span class="attention-label">Needs your attention</span><ul></ul></div>
    <span class="who" id="who"></span>
    <span class="clock" title="tower time">UTC <b id="utc">--:--:--</b></span>
  </header>

  <main id="content">
    <p class="loading">Loading...</p>
  </main>

  <footer class="footer">
    <span>warte v{{VERSION}}</span>
    <span id="refresh-status" class="sse-status">refreshes every 30 s</span>
  </footer>

  <script>
    // The Machines view's history range, remembered per viewer when the
    // browser lets us (REQ-MHIST-003); 24 h otherwise.
    function warteRange() {
      try { return localStorage.getItem('warte.range') || '24h'; } catch (e) { return '24h'; }
    }
    function warteSetRange(r) {
      try { localStorage.setItem('warte.range', r); } catch (e) {}
      warteHash();
    }
    // Machine histories the viewer has open: sent with every refresh so the
    // server renders them open, and kept in the address
    // (#machines/<host>?range=7d), so a reload or a shared link opens them.
    var warteOpenHosts = [];
    (function () {
      var m = /^#machines\/([^?]+)(?:\?range=([0-9a-z]+))?$/.exec(location.hash);
      if (m) {
        try { warteOpenHosts.push(decodeURIComponent(m[1])); } catch (e) {}
        if (m[2]) { try { localStorage.setItem('warte.range', m[2]); } catch (e) {} }
      }
    })();
    function warteOpen() { return warteOpenHosts.join(','); }
    function warteHash() {
      if (location.hash.split(/[\/?]/)[0] !== '#machines') return;
      var h = '#machines';
      if (warteOpenHosts.length) {
        h += '/' + encodeURIComponent(warteOpenHosts[warteOpenHosts.length - 1]) + '?range=' + warteRange();
      }
      if (location.hash !== h) history.replaceState(null, '', h);
    }
    // toggle does not bubble: listen in the capture phase
    document.addEventListener('toggle', function (e) {
      var d = e.target;
      if (!d.matches || !d.matches('details.mhist') || !d.dataset.host) return;
      var host = d.dataset.host;
      warteOpenHosts = warteOpenHosts.filter(function (x) { return x !== host; });
      if (d.open) warteOpenHosts.push(host);
      warteHash();
    }, true);
  </script>
  <script>
    // Active nav button, and a periodic refresh of the current view. Live push
    // (warte watch / long-poll, v1.4.1) replaces the timer later. Ask is not
    // reloaded whole: it would wipe what you typed; its answer and in-flight
    // list refresh on their own (#ask-live).
    // The view lives in the URL (#machines, #queue, ...): a reload, a bookmark
    // or a shared link opens that view, and back/forward move between views.
    var buttons = Array.prototype.slice.call(document.querySelectorAll('.nav-btn'));
    // with no view in the URL the page opens on Overview, in the Now group
    var landing = document.querySelector('.nav-btn[data-default]') || buttons[0];
    var current = landing;
    function slug(btn) { return '#' + btn.textContent.trim().toLowerCase().replace(/\s+/g, '-'); }
    function fromHash() {
      var view = location.hash.split(/[\/?]/)[0];
      return buttons.find(function (b) { return slug(b) === view; }) || landing;
    }
    // REQ-DASH-019: five groups; the open group's views form the second row,
    // and a group opens on its first view that is not hidden
    var groups = Array.prototype.slice.call(document.querySelectorAll('.nav-group'));
    var rows = Array.prototype.slice.call(document.querySelectorAll('.nav-views'));
    function showGroup(g) {
      groups.forEach(function (b) { b.classList.toggle('active', b.dataset.group === g); });
      rows.forEach(function (r) { r.hidden = r.dataset.group !== g; });
      warteHiddenNote();
    }
    groups.forEach(function (gb) {
      gb.addEventListener('click', function () {
        var row = rows.find(function (r) { return r.dataset.group === gb.dataset.group; });
        var first = row && row.querySelector('.nav-btn:not([hidden])');
        if (first) htmx.trigger(first, 'click'); else showGroup(gb.dataset.group);
      });
    });
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        current = btn;
        btn.hidden = false;
        showGroup(btn.closest('.nav-views').dataset.group);
        if (location.hash.split(/[\/?]/)[0] !== slug(btn)) history.pushState(null, '', slug(btn));
      });
    });
    window.addEventListener('popstate', function () { htmx.trigger(fromHash(), 'click'); });
    // after htmx has processed the page (its listener was registered first)
    document.addEventListener('DOMContentLoaded', function () { htmx.trigger(fromHash(), 'click'); });
    // Empty views leave the row and the row says so; a link to one still opens
    // it. Red and amber counts sit on the groups (REQ-DASH-019).
    var warteHidden = [];
    function warteHiddenNote() {
      var note = document.getElementById('nav-hidden-note');
      var open = rows.find(function (r) { return !r.hidden; });
      var names = open ? Array.prototype.slice.call(open.querySelectorAll('.nav-btn[hidden]')).map(function (b) { return b.textContent.trim(); }) : [];
      note.hidden = names.length === 0;
      note.textContent = names.length ? 'hidden while empty: ' + names.join(', ') : '';
    }
    function warteNavState() {
      fetch('api/dashboard/nav-state').then(function (r) { return r.json(); }).then(function (s) {
        warteHidden = s.hidden || [];
        buttons.forEach(function (b) {
          b.hidden = b !== current && warteHidden.indexOf(slug(b).slice(1)) >= 0;
        });
        groups.forEach(function (g) {
          var c = (s.badges || {})[g.dataset.group] || {};
          var badge = g.querySelector('.nav-badge');
          var n = c.red || c.amber || 0;
          badge.hidden = !n;
          badge.textContent = n ? String(n) : '';
          badge.className = 'nav-badge' + (c.red ? ' red' : c.amber ? ' amber' : '');
          badge.title = (c.red ? c.red + ' red' : '') + (c.red && c.amber ? ', ' : '') + (c.amber ? c.amber + ' amber' : '');
        });
        var strip = document.getElementById('attention');
        var list = strip.querySelector('ul');
        list.textContent = '';
        (s.attention || []).forEach(function (a) {
          var li = document.createElement('li');
          li.className = 'attention-' + a.kind;
          var link = document.createElement('a');
          link.href = '#' + a.view;
          link.textContent = a.text;
          li.appendChild(link);
          list.appendChild(li);
        });
        strip.hidden = list.children.length === 0;
        warteHiddenNote();
      }).catch(function () {});
    }
    warteNavState();
    setInterval(function () { if (!document.hidden) warteNavState(); }, 30000);
    // Tower clock: UTC, like the timestamps everywhere else.
    var utc = document.getElementById('utc');
    function tick() { utc.textContent = new Date().toISOString().slice(11, 19); }
    tick();
    setInterval(tick, 1000);
    setInterval(function () {
      if (current && !current.hasAttribute('data-no-refresh') && !document.hidden) {
        htmx.trigger(current, 'click');
      }
    }, 30000);
  </script>
  <script>
    // who is signed in (REQ-AUTH-003); nothing shows without [auth]
    fetch("api/me").then(function (r) { return r.json(); }).then(function (m) {
      var el = document.getElementById("who");
      if (!m.auth || !el) return;
      if (m.user) {
        el.textContent = m.user.name + " · " + m.user.role + " · ";
        // REQ-ATTN-001: the signed-in user's own attention schedule
        var h = document.createElement("a"); h.href = "#my-hours"; h.textContent = "My hours";
        h.setAttribute("hx-get", "api/dashboard/attention-partial"); h.setAttribute("hx-target", "#content");
        el.appendChild(h); el.appendChild(document.createTextNode(" · "));
        if (window.htmx) htmx.process(h);
        var a = document.createElement("a"); a.href = "auth/logout"; a.textContent = "Sign out";
        el.appendChild(a);
      } else {
        var b = document.createElement("a"); b.href = "auth/login"; b.textContent = "Sign in";
        el.appendChild(b);
      }
    }).catch(function () {});
  </script>
  <script>
    // nav: the app switcher closes on a tap outside it or on Escape
    document.addEventListener('click', function (e) {
      document.querySelectorAll('details.appswitch[open]').forEach(function (d) {
        if (!d.contains(e.target)) d.open = false;
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('details.appswitch[open]').forEach(function (d) {
        d.open = false; d.querySelector('summary').focus();
      });
    });
  </script>
  <script src="idle.js" defer></script>
</body>
</html>
