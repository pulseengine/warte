[package]
name = "warte-check"
version = "1.6.55"
edition = "2021"
license = "Apache-2.0"
description = "warte's report validators (architecture.v1, temper-report.v1), with no async runtime, so they build as a WASI p2 component"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
