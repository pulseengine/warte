artifacts:
  # ============================================================
  # SYSTEM REQUIREMENTS — trace roots for warte v0.1
  # Each requirement traces to system constraints and cybersecurity goals
  # ============================================================

  # --- Agent Registration & Identity ---
  - id: REQ-AGENT-REG-001
    type: requirement
    title: Agent registration requires cryptographic identity proof
    status: accepted
    release: v0.1.0
    description: >
      The control tower SHALL require every agent registration to include a
      cryptographic identity proof. Accepted proof types: (a) mTLS client
      certificate signed by the warte CA, (b) signed challenge-response using
      an Ed25519 key pair registered out-of-band, (c) hardware-backed attestation
      (TPM 2.0 or Apple Secure Enclave / Android Keystore). Registrations
      without valid proof SHALL be rejected with a structured error.
    links:
      - type: satisfies
        target: SC-001
      - type: satisfies
        target: CG-001

  - id: REQ-AGENT-REG-002
    type: requirement
    title: Agent identity is bound to a unique agent ID
    status: accepted
    release: v0.1.0
    description: >
      Each registered agent SHALL be assigned a unique, immutable agent ID
      (UUIDv7 or ULID). The agent ID SHALL be bound to the agent's cryptographic
      identity at registration time. Re-registration with a different identity
      under the same agent ID SHALL be rejected.
    links:
      - type: satisfies
        target: SC-001

  # --- Artifact Distribution ---
  - id: REQ-ARTIFACT-001
    type: requirement
    title: Artifact downloads require agent authentication
    status: accepted
    release: v0.1.0
    description: >
      The artifact download endpoint SHALL require a valid agent authentication
      token (mTLS or signed bearer token with < 5 minute expiry). Unauthenticated
      download requests SHALL be rejected with HTTP 401.
    links:
      - type: satisfies
        target: SC-002

  - id: REQ-ARTIFACT-002
    type: requirement
    title: Artifacts carry verifiable integrity proofs
    status: accepted
    release: v0.1.0
    description: >
      Every artifact in the distribution store SHALL carry an integrity proof:
      either (a) a sigil/wsc detached signature, or (b) a SHA-256 hash entry in
      a signed manifest (SHA256SUMS signed by the release key). The control
      tower SHALL verify the proof before serving. Agents SHALL verify the
      proof after download.
    links:
      - type: satisfies
        target: SC-002
      - type: satisfies
        target: CG-002

  - id: REQ-ARTIFACT-003
    type: requirement
    title: Artifact download is scoped to agent access rights
    status: accepted
    release: v0.1.0
    description: >
      The control tower SHALL enforce per-agent access scoping on artifact
      downloads. An agent SHALL only download artifacts it has been granted
      access to. Access grants SHALL be checked on every download request.
    links:
      - type: satisfies
        target: SC-002

  # --- Access Control ---
  - id: REQ-ACCESS-001
    type: requirement
    title: Access rights are managed via a central policy service
    status: accepted
    release: v0.1.0
    description: >
      The system SHALL provide a central access control service that manages
      agent access rights (grant, revoke, query). The service SHALL expose a
      REST API and SHALL be the single source of truth for access decisions.
    links:
      - type: satisfies
        target: SC-003

  - id: REQ-ACCESS-002
    type: requirement
    title: Access revocation propagates within 5 seconds
    status: accepted
    release: v0.1.0
    description: >
      When an agent's access is revoked, the revocation SHALL propagate to all
      warte instances and downstream services within 5 seconds. The access
      control service SHALL push revocations (not poll), actively disconnect
      the agent's active sessions, and confirm propagation before acknowledging.
    links:
      - type: satisfies
        target: SC-003
      - type: satisfies
        target: CG-003

  - id: REQ-ACCESS-003
    type: requirement
    title: Access rights are scoped per resource and action
    status: accepted
    release: v0.1.0
    description: >
      Access rights SHALL be scoped by resource (artifact, agent, instance)
      and action (read, download, register, revoke, control). The access
      control service SHALL support role-based access control (RBAC) with
      custom roles per deployment.
    links:
      - type: satisfies
        target: SC-003

  # --- Multi-Instance Synchronization ---
  - id: REQ-SYNC-001
    type: requirement
    title: Instances synchronize state via an authenticated sync protocol
    status: accepted
    release: v0.1.0
    description: >
      All warte instances SHALL synchronize shared state (agent registrations,
      access rights, captured data) via an authenticated sync protocol using
      mutual TLS with per-instance certificates. Sync messages SHALL carry
      integrity proofs.
    links:
      - type: satisfies
        target: SC-005
      - type: satisfies
        target: CG-006

  - id: REQ-SYNC-002
    type: requirement
    title: Sync conflicts are detected and resolved deterministically
    status: accepted
    release: v0.1.0
    description: >
      The sync mechanism SHALL detect conflicting updates using version vectors
      and resolve them deterministically (last-writer-wins by version vector,
      or CRDT-based merge for commutative state). Unresolvable conflicts SHALL
      trigger an operator alert.
    links:
      - type: satisfies
        target: SC-005

  - id: REQ-SYNC-003
    type: requirement
    title: Instance divergence is detected and alerted
    status: accepted
    release: v0.1.0
    description: >
      The system SHALL detect when instances have diverged beyond a threshold
      (e.g., version vector distance > 3, or conflicting state for > 30 seconds)
      and SHALL alert the operator via the dashboard and mobile notification.
    links:
      - type: satisfies
        target: SC-005

  # --- Mobile Access ---
  - id: REQ-MOBILE-001
    type: requirement
    title: Mobile control uses mutual TLS with device-bound certificates
    status: draft
    release: v1.7.0
    description: >
      The mobile control channel (Android/iOS) SHALL use mutual TLS with
      device-bound client certificates. The client certificate SHALL be
      stored in the device's hardware-backed keystore (Android Keystore /
      iOS Keychain with kSecAttrAccessibleWhenUnlockedThisDeviceOnly).
    links:
      - type: satisfies
        target: SC-004
      - type: satisfies
        target: CG-004

  - id: REQ-MOBILE-002
    type: requirement
    title: Mobile commands require operator biometric authentication
    status: draft
    release: v1.7.0
    description: >
      Every control command issued via the mobile client SHALL require operator
      authentication via biometric (fingerprint/face) or hardware token (YubiKey).
      The authentication SHALL be verified server-side, not just client-side.
    links:
      - type: satisfies
        target: SC-004
      - type: satisfies
        target: CG-004

  - id: REQ-MOBILE-003
    type: requirement
    title: Mobile client shows real-time system status
    status: draft
    release: v1.7.0
    description: >
      The mobile client SHALL display real-time system status (agent health,
      CI status, access rights, alerts) with freshness indicators. Status
      data SHALL be pushed via WebSocket or Server-Sent Events, not polled.
    links:
      - type: satisfies
        target: SC-006

  # --- Edge Security ---
  - id: REQ-EDGE-001
    type: requirement
    title: Edge proxy terminates TLS 1.3 and enforces rate limiting
    status: accepted
    release: v0.1.0
    description: |
      The edge proxy SHALL terminate TLS 1.3 for all external connections, enforce per-IP and per-agent rate limiting (configurable limits, default: 100 req/min per IP, 1000 req/min per agent), and drop connections exceeding limits.

    links:
      - type: satisfies
        target: SC-007
      - type: satisfies
        target: CG-005

  - id: REQ-EDGE-002
    type: requirement
    title: Edge proxy validates all requests against schemas
    status: accepted
    release: v0.1.0
    description: >
      The edge proxy SHALL validate all incoming requests against JSON schemas
      or OpenAPI specifications before forwarding to internal instances.
      Invalid requests SHALL be rejected with HTTP 400 and logged.
    links:
      - type: satisfies
        target: SC-007

  - id: REQ-EDGE-003
    type: requirement
    title: Edge proxy auto-patches within 24 hours
    status: accepted
    release: v0.1.0
    description: >
      All software on the edge proxy SHALL be configured for automatic security
      patching with a maximum 24-hour window for critical/high CVEs. The patch
      status SHALL be visible on the dashboard.
    links:
      - type: satisfies
        target: SC-007
      - type: satisfies
        target: CG-005

  # --- Dashboard & Observability ---
  - id: REQ-DASH-001
    type: requirement
    title: Dashboard displays status with freshness indicators
    status: accepted
    release: v0.1.0
    description: >
      The dashboard SHALL display a last-updated timestamp and freshness
      indicator (green < 30s, yellow < 5min, red > 5min) for every status item.
      Stale data SHALL be visually distinguished (dimmed, warning icon).
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-DASH-002
    type: requirement
    title: Dashboard provides agent registry overview
    status: accepted
    release: v0.1.0
    description: >
      The dashboard SHALL provide an overview of all registered agents:
      agent ID, identity type, access rights, last heartbeat, instance
      assignment, and health status.
    links:
      - type: satisfies
        target: SC-001

  - id: REQ-DASH-003
    type: requirement
    title: Dashboard provides CI status overview
    status: accepted
    release: v0.1.0
    description: >
      The dashboard SHALL display CI status for all repos: gate status
      (green/red/pending), queue depth, estimated wait time, and critical
      path analysis.
    links:
      - type: satisfies
        target: SC-006

  # --- Agent Data Capture ---
  - id: REQ-CAPTURE-001
    type: requirement
    title: Agents capture and report structured data
    status: accepted
    release: v0.1.0
    description: >
      Agents SHALL capture structured data during their work (build logs,
      test results, tool friction reports, session learnings) and report it
      to the control tower via an authenticated API. Captured data SHALL be
      stored per-agent and synchronized across instances.
    links:
      - type: satisfies
        target: SC-005

  - id: REQ-CAPTURE-002
    type: requirement
    title: Captured data is queryable via the API
    status: accepted
    release: v0.1.0
    description: >
      Captured agent data SHALL be queryable via the warte API with filters
      (agent ID, time range, data type, instance). Query results SHALL include
      freshness metadata.
    links:
      - type: satisfies
        target: SC-006

  # --- API ---
  - id: REQ-API-001
    type: requirement
    title: REST API with structured JSON responses
    status: accepted
    release: v0.1.0
    description: >
      The control tower SHALL expose a REST API with structured JSON responses.
      All endpoints SHALL support --format json (CLI) and Accept: application/json
      (HTTP). Error responses SHALL include structured error codes and messages.
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-API-002
    type: requirement
    title: API requires authentication for all mutating operations
    status: accepted
    release: v0.1.0
    description: >
      All mutating API operations (POST, PUT, DELETE, PATCH) SHALL require
      authentication. Read operations MAY be public for dashboard display but
      SHALL be rate-limited. Authentication SHALL use the same identity
      mechanisms as agent registration (mTLS or signed bearer tokens).
    links:
      - type: satisfies
        target: SC-001
      - type: satisfies
        target: SC-007

  - id: REQ-API-003
    type: requirement
    title: Agent bearer tokens are minted by the operator and survive restarts
    status: accepted
    release: v1.5.1
    description: >
      The token-signing key SHALL come from a seed file (mode 0600, created on
      first start, refused if other users can read it), not a fresh random key
      per start, so an issued token stays valid across restarts. The operator
      SHALL mint an agent token with `warte token mint <agent-id>` on the
      ground station host; there SHALL be no HTTP endpoint that mints one. A
      request with no token, a tampered token, an expired token, or a token
      from another seed SHALL get 401 on the write routes.
    links:
      - type: satisfies
        target: SC-001

  - id: REQ-API-004
    type: requirement
    title: A token's rights and agent decide which write routes it may call, and as whom
    status: implemented
    release: v1.7.0
    description: >
      Every mutating route SHALL require a named right in the bearer token,
      looked up in one table (agents:register, agents:heartbeat, agents:data,
      access:grant, access:revoke, sync:update, costs:write). A token without
      the right SHALL get 403; a missing or invalid token stays 401. A mutating
      request matching no row SHALL be refused. On agents/{id}/* the id, and on
      agents/register the name asked for, SHALL equal the token's agent id
      unless the token holds agents:any. `warte token mint` SHALL issue the
      agent rights by default, add agents:any with --any-agent and named rights
      with --right, and reject an unknown right. The docs and the contract
      SHALL list each route's right.
    links:
      - type: satisfies
        target: SC-001

  # --- CLI ---
  - id: REQ-CLI-001
    type: requirement
    title: CLI follows PulseEngine CLI conventions
    status: accepted
    release: v0.1.0
    description: >
      The warte CLI SHALL follow PulseEngine CLI conventions: --version/-V prints
      'warte <semver>' and exits 0, --help exits 0, unknown flags exit 2,
      structured output via --format json.
    links:
      - type: satisfies
        target: SC-006

  # --- Migration ---
  - id: REQ-MIGRATE-001
    type: requirement
    title: Replace smithy-hub with warte hub in place, after a parallel run
    status: verified
    release: v1.5.0
    description: "There SHALL be no data import: warte hub SHALL read smithy hub's data directory (hub-state.json, ledger/*.jsonl) in place, with smithy hub's flags. Cut-over SHALL follow a parallel run in which the smithy agent feeds both hubs and scripts/hub-parity.sh reports zero differences, after which smithy-hub.service on the ground-station host runs warte hub instead."
    links:
      - type: satisfies
        target: SC-005
    fields:
      upstream-ref: https://github.com/pulseengine/warte/issues/36

  - id: REQ-MIGRATE-002
    type: requirement
    title: Migrate repo hardening config from temper
    status: accepted
    release: v0.1.0
    description: >
      The system SHALL provide a migration path for repo hardening configuration
      from temper (branch protection rules, labels, templates, dependabot config)
      into warte's configuration model. Migration SHALL preserve all existing
      settings and SHALL be verifiable.
    links:
      - type: satisfies
        target: SC-007

  - id: REQ-CI-DATA-001
    type: requirement
    title: GitHub CI data collection — webhook receiver + status poller for ETA estimation
    status: deprecated
    release: v0.4.0
    description: "The system SHALL collect CI data from GitHub (and GitLab) to feed the ETA estimator and dashboard. Collection methods: (a) GitHub Actions webhook receiver (workflow_run events: queued, in_progress, completed), (b) periodic status poller (fallback when webhooks are not configured), (c) manual CLI import. Collected data: job queued_at, started_at, completed_at, runner pool, repo, PR number. This data feeds the wait_history table (for ETA estimation) and ci_status cache (for dashboard)."
    tags: [superseded-by-ground-station]
    links:
      - type: satisfies
        target: SC-006

      - type: traces-to
        target: DD-SMITHY-001
  - id: REQ-DASH-004
    type: requirement
    title: Dashboard HTML frontend — HTMX-based overview, ask, queue views
    status: accepted
    release: v0.4.0
    description: "The system SHALL serve an HTML dashboard frontend (HTMX-based, like rivet serve) with views: (a) Overview — all repos, all gates, green/red/pending, (b) Ask — ETA query form with results, (c) Queue — runner pool, waiting jobs, hardware availability, (d) Agents — agent registry with health status, (e) Artifacts — artifact list with download links. The frontend SHALL use SSE (/api/events) for real-time updates. The frontend SHALL show freshness indicators for all data."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-WEBHOOK-001
    type: requirement
    title: GitHub webhook HTTP endpoint — receive workflow_run events
    status: deprecated
    release: v0.5.0
    description: The system SHALL expose POST /api/webhooks/github to receive GitHub Actions workflow_run webhook events. The endpoint SHALL verify the X-Hub-Signature-256 header (HMAC-SHA256 with the configured webhook secret) before processing. Events SHALL be forwarded to the CiDataCollector for storage. The endpoint SHALL return 202 Accepted on success, 401 on invalid signature, 400 on invalid payload. The webhook secret SHALL be configured via warte.toml (github_webhook_secret) or environment variable (WARTE_GITHUB_WEBHOOK_SECRET).
    tags: [superseded-by-ground-station]
    links:
      - type: satisfies
        target: SC-006

      - type: traces-to
        target: DD-SMITHY-001
  - id: REQ-POLLER-001
    type: requirement
    title: Periodic CI status poller — fallback when webhooks are not configured
    status: deprecated
    release: v0.5.0
    description: The system SHALL provide a periodic CI status poller that queries the GitHub/GitLab API every 60 seconds (configurable) to collect CI status for all repos. The poller SHALL be the fallback when webhooks are not configured. The poller SHALL record measured waits (queued_at → started_at) in the wait_history table. The poller SHALL update the ci_status cache for the dashboard. The poller SHALL run as a background task started by warte serve.
    tags: [superseded-by-ground-station]
    links:
      - type: satisfies
        target: SC-006

      - type: traces-to
        target: DD-SMITHY-001
  - id: REQ-DASH-005
    type: requirement
    title: Dashboard queue view — runner pool, waiting jobs, hardware availability
    status: verified
    release: v1.4.0
    description: "The dashboard SHALL provide a Queue view showing: (a) runner pools from the ground station's latest snapshot, with jobs queued and oldest/median wait per pool, and self-hosted runners busy/total; (b) every queued run with repo, PR or branch, workflow, pool, job count and time waiting; (c) hardware availability (free/claimed boards, by whom, since when) from agent data. Author-controlled names SHALL be HTML-escaped. Freshness SHALL be the snapshot's real age, shown as stale beyond 5 minutes; with no ground station or no telemetry the view SHALL say so."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-DASH-006
    type: requirement
    title: Dashboard critical path view — longest chain of dependent gates
    status: verified
    release: v1.5.0
    description: "The dashboard SHALL provide a Critical Path view showing the longest chain of dependent repos that holds a release. The view SHALL compute the critical path from: (a) the repo dependency graph (REQ-CRIT-001), (b) CI state per repo from the ground station (queued or running = not green), (c) queue depth per repo. The critical path is the longest chain of repos where each depends on the next and at least one is not green. The view SHALL show the chain (repo → repo → repo), the bottleneck repo, and a lower bound on release time from the measured pool waits. It refreshes with the other views (every 30 s); live push is REQ-REALTIME-001 (an earlier version of this requirement asked for SSE, which never worked, #50)."
    links:
      - type: satisfies
        target: SC-006
    fields:
      upstream-ref: https://github.com/pulseengine/warte/issues/44

  - id: REQ-DASH-007
    type: requirement
    title: Dashboard resources view — who needs what (RAM, disk, runners, boards)
    status: accepted
    release: v0.7.0
    description: "The dashboard SHALL provide a Resources view showing: (a) agent resource needs — which agents need which resources (RAM, disk, runners, boards), (b) resource utilization — how much of each resource is in use vs available, (c) hardware claims — which boards are claimed by which agents, since when, for how long. Data sources: agent registry (agent metadata), agent_data (resource claims, hardware claims). The view SHALL use SSE for real-time updates and show freshness indicators."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-DASH-008
    type: requirement
    title: Dashboard outages + friction views — GitHub status, fleet health, tool errors
    status: accepted
    release: v0.7.0
    description: "The dashboard SHALL provide: (a) Outages view — GitHub status (from status.github.com API), fleet health (agent heartbeat status, instance sync status), (b) Friction view — tool errors, workarounds, build decisions (from agent_data where data_type = 'friction'), (c) Schedule view — weekly cron table, who runs what when (from agent_data where data_type = 'schedule'), (d) Health view — factory-wide metrics from agent heartbeats (agents healthy/unhealthy, CI green/red, queue depth). All views SHALL use SSE for real-time updates and show freshness indicators."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-WEBHOOK-002
    type: requirement
    title: GitLab webhook endpoint — receive pipeline events
    status: deprecated
    release: v0.8.0
    description: The system SHALL expose POST /api/webhooks/gitlab to receive GitLab CI pipeline webhook events. The endpoint SHALL verify the X-Gitlab-Token header (shared secret token) before processing. Events SHALL be forwarded to the CiDataCollector for storage. The endpoint SHALL return 202 Accepted on success, 401 on invalid token, 400 on invalid payload. The token SHALL be configured via warte.toml (gitlab_webhook_token) or environment variable (WARTE_GITLAB_WEBHOOK_TOKEN).
    tags: [superseded-by-ground-station]
    links:
      - type: satisfies
        target: SC-006

      - type: traces-to
        target: DD-SMITHY-001
  - id: REQ-STATUS-001
    type: requirement
    title: GitHub status API integration — real status from status.github.com
    status: accepted
    release: v0.8.0
    description: "The outages view SHALL query the real GitHub status from status.github.com (or GHE status page) instead of hardcoded 'operational'. The status SHALL be cached (5-minute TTL) and shown in the outages view with freshness indicator. The status SHALL include: overall status (operational/degraded/outage), active incidents (title, status, started_at)."
    links:
      - type: satisfies
        target: SC-006
  - id: REQ-DASH-009
    type: requirement
    title: Wire StatusClient into outages view — real GitHub status in dashboard
    status: accepted
    release: v0.9.0
    description: "The outages view SHALL use the StatusClient to query real GitHub status (status.github.com) instead of hardcoded 'operational'. The view SHALL show: overall status (operational/degraded/outage), active incidents (title, status, started_at), last fetched timestamp with freshness indicator. The StatusClient SHALL be initialized in AppState and shared across requests (5-minute cache TTL)."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-DASH-010
    type: requirement
    title: Dashboard navigation — add buttons for queue, critical path, resources, outages, friction, schedule, health views
    status: accepted
    release: v0.9.0
    description: "The dashboard navigation SHALL include buttons for all 11 views: Overview, Ask, Queue, Critical Path, Resources, Outages, Friction, Schedule, Health, Agents, Artifacts. Each button SHALL load the corresponding HTMX partial via hx-get. The active button SHALL be highlighted. The navigation SHALL be responsive (collapsible on mobile)."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-DASH-011
    type: requirement
    title: Hardware availability in queue view — boards free/claimed, by whom, since when
    status: accepted
    release: v1.0.0
    description: "The queue view SHALL show hardware availability: which boards are free, which are claimed, by which agent, since when, for how long. Data source: agent_data where data_type = 'hardware-claim'. The view SHALL show a table of boards with status (FREE/CLAIMED), agent, and duration. The view SHALL use SSE for real-time updates and show freshness indicators."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-POLLER-002
    type: requirement
    title: Poller measured wait recording — record queued → started transitions from polling
    status: deprecated
    release: v1.0.0
    description: The CI status poller SHALL record measured waits (queued_at → started_at) in the wait_history table when it detects a job transitioning from queued to in_progress. The poller SHALL track the last known state of each job (by repo + run_id) and compute the wait time when the job starts. This complements the webhook-based wait recording (which is more precise but requires webhook configuration).
    tags: [superseded-by-ground-station]
    links:
      - type: satisfies
        target: SC-006

      - type: traces-to
        target: DD-SMITHY-001
  - id: REQ-CRIT-001
    type: requirement
    title: Critical path dependency graph — real repo dependencies from rivet/GitHub
    status: approved
    release: v1.7.0
    description: "The critical path view SHALL compute the real dependency graph between repos, not just ci_status heuristics. Data sources: (a) rivet externals (rivet sync / rivet externals shows cross-repo dependencies), (b) GitHub dependency graph API (dependabot alerts show dependencies), (c) manual dependency declaration in warte.toml (repo_dependencies = [{repo='jess', depends_on=['relay','gale']}]). The critical path SHALL be the longest chain of repos where each depends on the next and at least one gate is not green. The view SHALL show: the chain (repo → repo → repo), the bottleneck repo, the estimated minimum release time."
    links:
      - type: satisfies
        target: SC-006
    fields:
      upstream-ref: https://github.com/pulseengine/warte/issues/44

  - id: REQ-DASH-012
    type: requirement
    title: FREE board listing in hardware availability — show all boards, not just claimed
    status: accepted
    release: v1.1.0
    description: "The hardware availability view SHALL show all known boards, not just claimed ones. Data source: agent_data where data_type = 'hardware-catalog' (list of all boards) + agent_data where data_type = 'hardware-claim' (claimed boards). The view SHALL show: board name, status (FREE/CLAIMED), agent (if claimed), duration (if claimed). FREE boards SHALL be shown with a green badge, CLAIMED boards with a red badge."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-CRIT-002
    type: requirement
    title: Rivet externals integration — auto-discover cross-repo dependencies for critical path
    status: accepted
    release: v1.2.0
    description: "The critical path computer SHALL auto-discover cross-repo dependencies from rivet externals (rivet sync / rivet externals) instead of requiring manual dependency declaration. The integration SHALL: (a) run 'rivet externals' in each repo to discover external dependencies, (b) parse the output to build the dependency graph, (c) feed the graph into CriticalPathComputer. The integration SHALL be optional — manual dependency declaration (warte.toml repo_dependencies) SHALL remain as a fallback. The integration SHALL cache the discovered graph (5-minute TTL)."
    links:
      - type: satisfies
        target: SC-006

  - id: REQ-SECFEED-001
    type: requirement
    title: "Security findings feed: hosts report detector findings through the probe; warte shows and alerts (#114)"
    status: approved
    release: v1.7.0
    description: warte SHALL accept security findings (drift check, AIDE, Falco) from enrolled probes as a signed --feed with a bounded, metadata-only schema (source, rule, severity, subject, first_seen, last_seen, count; no field for file contents or secret values), SHALL show open findings per host newest first with acknowledge / accept-into-baseline and history, and SHALL alert on new high-severity findings and on a host whose detector stops reporting. warte detects nothing itself.
    fields:
      category: functional
    provenance:
