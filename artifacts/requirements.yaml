  - id: REQ-PROBE-010
    type: requirement
    title: "Probe inventory: varve PATH shadowing as agents see it, Claude plugins, scheduled jobs and their last result"
    status: verified
    release: v1.6.0
    description: "The probe SHALL report (1) which varve-shimmed tools are shadowed by an earlier binary on the PATH agents actually run with, recorded by the session-start hook in the agent's own environment, with the shadowing binary's directory (home as ~) and version; (2) installed Claude Code plugins with marketplace and version; (3) the machine's scheduled jobs (macOS: the user's LaunchAgents; Linux: systemd timers; cron: schedule and program name only, never arguments) with their last exit status. The Machines view SHALL show them and raise drift findings: a shadowed tool, a plugin behind the newest version in use on another machine, a scheduled job whose last run failed. Read-only; no command lines, arguments or environment values are reported. Refines #52 (toolchain and agent inventory); motivated by 2026-10-27 (rivet 0.38.0 on PATH vs pin 0.41.1) and 2026-11-05 (rivet, spar, synth, with-device shadowed on the main Mac; a monthly job killed with -9)."
