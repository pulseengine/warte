    type: requirement
    title: "Briefing view: a plain line, three bullets, a collapsed IT section and earlier briefings"
    status: verified
    release: v1.6.10
    description: "The dashboard SHALL show the latest briefing (or a chosen earlier one): the line, the three bullets, and collapsed, per repository the merged pull requests and closed issues with links, releases, CI runs and failed jobs, the pull requests waiting, the token check, the setup markers and any gaps. Every string from GitHub or a model run SHALL be escaped."
