        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-06T21:29:53Z

  - id: REQ-PROBE-014
    type: requirement
    title: Only an agent asking the user is waiting; finished sessions are done, then idle; Copilot and Vibe sessions are recognised once; the airport lists every session
    status: verified
    release: v1.6.1
    description: "The hook SHALL report 'waiting for you' only when the agent asks the user: a permission prompt, an elicitation or an agent-needs-input notification, or a question tool (Claude AskUserQuestion, Copilot ask_user, Vibe ask_user_question). A finished turn (Claude and Copilot Stop, Vibe post_agent, an idle or completed notification) SHALL be 'done', reported as 'idle' after 30 minutes. Activity files of older hooks, whose 'waiting for you' also meant a finished turn, SHALL be read as 'done'. The probe SHALL report since when the activity holds. It SHALL recognise Copilot CLI (native binary or npm loader) and Mistral Vibe (vibe-rs, vibe-app-server, the vibe script) and count one session per agent process pair, keeping the innermost. The hook SHALL accept Claude Code, Copilot CLI (both casings, the event optionally given as --event) and Vibe payloads. The airport SHALL draw only waiting sessions orange with a beacon, show how many sessions are not drawn and how many are asking, and list every session with its state and duration when the machine is selected."
