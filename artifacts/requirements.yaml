  - id: REQ-PROBE-011
    type: requirement
    title: Probes report pressure, network, temperatures, battery, top processes and system health
    status: verified
    release: v1.6.0
    description: "Each probe report SHALL carry, where the platform offers it and without root: CPU and memory pressure and OOM kills since the last report (Linux); per-interface receive/transmit KB/s and errors per minute, loopback and virtual interfaces left out; temperatures grouped per sensor family (hottest member), with critical thresholds where known; battery charge, cycles and charging state; the top 5 processes by CPU (over one second) and by memory, summed per process name; failed systemd units, reboot required since, pending updates (apt simulation every 6 h; macOS softwareupdate daily) and security updates pending since, NTP sync and clock offset (Linux). Names SHALL pass a strict character whitelist or be dropped; no command lines, arguments, environment, paths or users. Everything but the process list SHALL become machine-history series. Findings: failed units; reboot required over 3 days; security updates pending over 7 days; clock offset over 500 ms (red over 5 s); NTP not synchronised; an OOM kill in the last hour; a sensor near (amber) or at (red) its critical temperature. The read API SHALL publish the block without error text."
    fields:
      category: functional
    links:
      - type: refines
        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-06T03:36:42Z

  - id: REQ-PROBE-012
    type: requirement
    title: Probes report disk health, debug probes and boards, and GPUs; root work in a separate collector
    status: verified
    release: v1.6.0
    description: "Each probe report SHALL carry: per whole disk SMART status, wear, media errors, power-on hours and temperature; USB devices (vendor:product id, product and vendor names through the whitelist, bound driver) with debug probes recognised by id or CMSIS-DAP product name; GPUs (model, and with nvidia-smi utilisation, memory and temperature); debug probes seen in the last 7 days and gone now. No serial numbers. On Linux the probe SHALL have no capabilities: a separate root oneshot, 'warte probe privileged', SHALL read SMART (smartctl -n standby) with no network I/O and write one JSON file; the probe SHALL read it as untrusted data (at most 256 KiB, schema warte.privileged.v1 with unknown fields refused, names re-checked, values bounded) and report missing, stale (over 2 h 10 min, or future-dated) or invalid instead of old numbers. Findings: SMART failing (red); wear >= 80 % amber, >= 95 % red; media errors; a probe gone; a stale or invalid collector. Both systemd units SHALL be documented in warte."
    fields:
      category: functional
    links:
      - type: refines
        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-06T06:12:51Z

  - id: REQ-PROBE-013
    type: requirement
    title: Machines show each probe's version and when its certificate ends; certificates that will run out are findings
    status: verified
    release: v1.6.1
    description: "The ground station SHALL keep, per enrolled probe, the not-after of the certificate on its last accepted report, and SHALL show the probe's version and that date on the machine card and publish both in /api/machines. A version SHALL be shown or published only when it is a plain version string (at most 40 characters of letters, digits, '.', '-', '+'). The version SHALL be marked when it is an older release than the ground station's; that alone SHALL NOT be a finding. Findings: a probe older than 1.5.0 (which cannot renew) whose certificate ends within 14 days (amber) or 3 days (red), saying which version it needs; a probe that can renew whose certificate ends within 7 days (amber) or 2 days (red), since renewal starts at 10 days left. An unreadable version SHALL be treated as able to renew."
    fields:
      category: functional
    links:
