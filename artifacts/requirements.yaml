    description: "warte SHALL classify a job as infra:not-acquired when its conclusion is cancelled, runner_name is empty, it ran no step, and its annotations contain 'not acquired by Runner'; SHALL show it so in the queue view and /api/queue, distinct from a code failure; and SHALL count it per hosted pool (runs-on label) and per UTC day, so the data decides whether a required hosted-macOS check is worth keeping. Read-only: no GitHub writes. Evidence: relay 2026-11-04, Test (macos) cancelled 3x, merge-group runs 41856213098 and 41870555941 ejected relay#636."
