    type: requirement
    title: "Costs schema 2: weekly token-check and wasted-effort counters, counts only"
    status: verified
    release: v1.6.9
    description: "warte SHALL accept costs reports of schema 1 and schema 2. Schema 2 adds weeks: per ISO week, sessions; advisor calls, compactions, cross-session messages received and SendMessage calls, main session and subagents apart; and per repository and active skill, tool uses and tool errors by tool (built-in name, or mcp:<server>), permission denials, repeated-failure streaks and loop-guard firings. Only counts and names that pass a strict character class are accepted, never error text. The Costs view SHALL show this week against the previous one and the error rates per tool, repository and skill."
    fields:
      category: functional
      priority: should
    links:
      - type: refines
        target: REQ-COSTS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-10T21:17:26Z

  - id: REQ-DASH-018
    type: requirement
    title: "Idle scene: after two minutes without input, a seasonal layer over the dashboard that changes every month"
    status: verified
    release: v1.6.9
    description: "After [idle] after_s (120) seconds without input, the dashboard SHALL show a translucent animated layer that leaves the dashboard visible and takes no clicks, with a caption: the month's theme (turned six months in the southern hemisphere), a calendar moment of the day or the next within 14 days, sunrise or sunset and daylight left, the moon's phase, the weather at the time zone's city and a fact from the ground station. Any input SHALL remove it. warte SHALL store no location: the browser's time zone stands in. ?calm and [idle] enabled = false turn it off; [idle] weather = false keeps the browser from calling the weather service."
    fields:
      category: functional
      priority: could
    links:
      - type: refines
        target: REQ-DASH-013
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-10T21:44:36Z

  - id: REQ-BRIEF-001
    type: requirement
    title: Briefing facts every two days from records, public repositories only
    status: verified
    release: v1.6.10
    description: "For each closed two-day period (UTC) warte SHALL build a fact sheet: merged pull requests, closed issues, releases and pull requests open for more than a day of the configured organisation, read from GitHub without a token so that only public repositories can appear; CI runs and failed jobs of those repositories from the ledger; the notional costs of the last 7 days against the 7 before; and the configured setup markers of the last two weeks. What could not be read SHALL be listed as a gap. Every briefing SHALL be kept with its facts."
    fields:
      category: functional
      priority: should
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-11T01:01:06Z

  - id: REQ-BRIEF-002
    type: requirement
    title: A written briefing names only what the facts hold; otherwise the template stays
    status: verified
    release: v1.6.10
    description: "warte SHALL write a template briefing from the facts at once. A text posted with the briefing:write right SHALL replace it only when it has one line and three bullets, at most 130 words, no link or markup, and every repository, #number, version and count it names is in that period's facts; otherwise warte SHALL answer 422 with the reason, keep the template and record the refusal. warte SHALL hold no model credential."
    fields:
      category: functional
      priority: should
    links:
