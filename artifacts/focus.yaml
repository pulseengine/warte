# warte#180: the night window from the Mac's Focus schedule. The owner chose
# to build it on 2026-11-22.
artifacts:
  - id: REQ-FOCUS-001
    type: requirement
    title: warte probe focus derives available from the night Focus schedule, writes only available, and writes nothing when in doubt
    status: verified
    release: v1.6.43
    description: "On macOS, warte probe focus SHALL read the Focus modes file, find the night Focus by identifier or name (default the Sleep Focus's identifier), and derive one available span, from the night window's end to its start. With --write it SHALL replace only available in the attention schedule, keep every other key's value, and never write off. It SHALL write nothing and exit 1 with the reason for an unreadable file, a changed format, a missing mode, no enabled schedule, a trigger without times, several schedules, an empty window or a schedule for only some days."
    fields:
      category: functional
      priority: could
      upstream-ref: https://github.com/pulseengine/warte/issues/180
    links:
      - type: refines
        target: REQ-ATTN-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T19:00:00Z

  - id: DD-FOCUS-001
    type: design-decision
    title: Field names confirmed on a real file; per-day schedules refused until their bit order is known
    status: verified
    release: v1.6.43
    description: "The field names come from one read of ModeConfigurations.json on macOS 27 (2026-11-22): data[0].modeConfigurations.<id>, a localized mode.name, triggers.triggers[] with class, enabledSetting, timePeriodStart/EndTimeHour/Minute and timePeriodWeekdays (127 for every day). That read also showed the Sleep Focus on a Health sleep trigger with no times, which the helper refuses. A weekday bitmask other than 127 is refused because the order of its bits is not confirmed, and a wrong guess would move the night window. The attention file is rewritten through a map of raw JSON values, so other keys' values keep their bytes."
    fields:
      rationale: "The kill criterion is a night window shortened or emptied without a warning; every unconfirmed case writes nothing instead."
    links:
      - type: satisfies
        target: REQ-FOCUS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T19:00:00Z

  - id: TEST-FOCUS-001
    type: verification
    title: Fixtures in the real file's shape, every doubt planted, and writes that keep other keys
    status: verified
    release: v1.6.43
    description: "tests/focus.rs: a Sleep schedule 22:30 to 06:30 gives 06:30-22:30, the localized name matches, a night not crossing midnight gives a span that does; a disabled schedule, a per-day mask, a sleep trigger without times, two schedules, an empty window, an out-of-range hour, an unknown shape, non-JSON and a missing mode are refused with their reasons; writing replaces only available, keeps the other keys' values and bytes, and never writes off; a doubt or an unreadable file writes nothing; an attention file that is not an object is left as it was. Negative controls: accepting a per-day mask and ignoring enabledSetting each failed the test."
    links:
      - type: verifies
        target: REQ-FOCUS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T19:00:00Z
