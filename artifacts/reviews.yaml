# warte#85: the pull requests one person has to review. The owner chose to
# build it on 2026-11-22.
artifacts:
  - id: REQ-PRREVIEW-001
    type: requirement
    title: warte lists the pull requests one reviewer has to review, with size, build, decision, re-review and age
    status: verified
    release: v1.6.43
    description: "With [reviews], warte SHALL scan GitHub with the reviewer's own read-only token from a private file, on an interval, one search per bucket (review requested from the reviewer, from each configured team, watched authors, watched repositories), leave out drafts and the reviewer's own pull requests, and show for each why it is listed, its size bucket, build state with the first failed check, review decision, the reviewer's latest review, whether a re-review is needed (commits after that review) and whether it is done (approved, green, mergeable), re-reviews first, then the longest waiting, done ones last. A failed scan SHALL keep the last list and never show the token. The view and GET /api/reviews SHALL answer a signed-in user, or without [auth] only a warte bound to loopback."
    fields:
      category: functional
      priority: should
      upstream-ref: https://github.com/pulseengine/warte/issues/85
    links:
      - type: refines
        target: REQ-AUTH-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T21:00:00Z

  - id: DD-PRREVIEW-001
    type: design-decision
    title: GraphQL search per bucket, a pure classifier, and loopback-only without a login
    status: verified
    release: v1.6.43
    description: "reviews::from_node and reviews::order turn GitHub's search nodes into the view's rows and order, so every rule is tested without GitHub. One viewer query plus one search per bucket per interval keeps the request count small (four searches every ten minutes for one team and two watchlists). The token is the reviewer's, read from a 0600 file at each scan, never stored or shown. Without [auth] the read API has no login, so the view answers only when warte is bound to loopback, which is how the reviewer runs it on their own machine."
    fields:
      rationale: "PR titles, authors and team membership are private work data; GitHub's own review list does not answer size, build, wait and re-review in one place."
    links:
      - type: satisfies
        target: REQ-PRREVIEW-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T21:00:00Z

  - id: TEST-PRREVIEW-001
    type: verification
    title: Nodes in GitHub's shape, the order, a scan against a stand-in GraphQL, the token file, and loopback-only access
    status: verified
    release: v1.6.43
    description: "tests/reviews.rs: a node becomes a row with its size, red build and failed check, re-review on an older reviewed commit, done when approved, green and mergeable, and a highlight; re-reviews come first, then the longest waiting, done ones last, and a duplicate keeps its first reason; a scan asks who the reviewer is and each search, leaves out drafts and the reviewer's own, and a refusal never echoes the token; the token file must be 0600 and hold one token; without a login a LAN bind answers 401 and the view shows no data, while loopback answers. Negative controls: always allowing access and never flagging a re-review each failed a test."
    links:
      - type: verifies
        target: REQ-PRREVIEW-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T21:00:00Z

  - id: REQ-PRREVIEW-002
    type: requirement
    title: "The queue reads several GitHub hosts and lists assigned PRs and issues, unanswered mentions and team requests apart"
    status: verified
    release: v1.6.59
    description: "warte SHALL read the queue from a list of sources, each a GitHub API (github.com, GitHub Enterprise Cloud or Server) with the person's own read-only token file and optional teams, and SHALL keep a single top-level token working as a list of one. Each source SHALL be scanned as its own login. Next to review requests to the person, the queue SHALL list team review requests in their own section, pull requests assigned to the person, issues assigned to them, and issues and pull requests that mention them with no post of theirs after the latest mention. Bodies and comments SHALL be read only to decide that and SHALL NOT be kept or shown. With more than one source the view SHALL filter by account. A source whose scan fails SHALL keep its last lists, say why without the token, and SHALL NOT hold up the other sources. Access stays as in REQ-PRREVIEW-001."
    fields:
      category: functional
      priority: should
      upstream-ref: https://github.com/pulseengine/warte/issues/237
    links:
      - type: refines
        target: REQ-PRREVIEW-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-28T12:00:00Z

  - id: DD-PRREVIEW-002
    type: design-decision
    title: One scan per source with its own login; issue buckets use a second GraphQL fragment; the mention rule is a pure function
    status: verified
    release: v1.6.59
    description: "ReviewsConfig gains sources; sources() returns the list or the legacy single source, for_source() narrows the config to one host and its teams. scan() runs the PR searches (now with assignee:@me) and two issue searches (assignee:@me for issues, mentions:@me) with an Issue/PullRequest fragment that carries body and the last 30 comments. unanswered_since() finds the latest post that mentions @login and is not the person's own, and lists the item until a later post of theirs. The shared state becomes Queue{accounts}, one Snapshot per source in configured order."
    fields:
      rationale: "Owner decisions on #236 and #237 (2026-11-28): one warte must see several orgs and a personal account and run at work on Enterprise, and the queue should hold assigned issues and PRs, mentions and team requests. The people views need only search, so they move first; the CI views follow as a second step of #236. Keeping the mention rule pure makes it testable without GitHub; a team mention that the text cannot show falls back to 'any post of mine answers it', which errs toward listing."
    links:
      - type: satisfies
        target: REQ-PRREVIEW-002
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-28T12:00:00Z

  - id: TEST-PRREVIEW-002
    type: verification
    title: tests/reviews.rs pins the mention rule, issue nodes, the source list, a multi-bucket scan and the account filter
    status: verified
    release: v1.6.59
    description: "a_mention_waits_until_the_person_answers_after_it: whole-login matching, waiting from the latest mention, answered after it, mentioned again, a team mention, a self-mention. issue_nodes_become_assigned_or_mentioned_items: kinds, waiting times, an answered mention and the person's own item dropped. sources_are_the_list_or_the_one_top_level_token_and_hosts_read_plainly: legacy and list configs, narrowing, github.com, ghe.com and GHES hosts. a_scan_fills_assigned_prs_assigned_issues_and_open_mentions: against a stand-in GraphQL the scan lists a review request, an assigned PR, an assigned issue and a mention, drops a mention of a PR already under review, and labels everything login@host. the_view_has_a_section_per_bucket_and_filters_by_account: sections with counts, an account filter only with two accounts, a failed source named, titles escaped. Negative control: taking the first mention instead of the latest failed the mention test."
    links:
      - type: verifies
        target: REQ-PRREVIEW-002
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-28T12:00:00Z
