# #46: the sensitive reads need an agent token even without [auth].
# Owner chose to build it on 2026-11-22 (issue burndown, security first).
artifacts:
  - id: REQ-API-007
    type: requirement
    title: Agent data, access lists, artifact downloads and the sync state need an agent token even without [auth]
    status: verified
    release: v1.6.43
    description: "Without [auth], GET /api/agents/{id}/data, /api/access/list/{agent}, /api/artifacts/{id}/download and /api/sync/state SHALL answer 401 without a valid warte agent token and 403 without agents:read. /api/agents/{id}/data SHALL answer only for the agents row of the token's own agent and /api/access/list/{agent} only for the token's own agent name, unless the token also holds agents:any. With [auth], the login gate SHALL keep covering them. Every other read route SHALL stay as it was."
    fields:
      category: constraint
      priority: must
    links:
      - type: refines
        target: REQ-API-005
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T13:00:00Z

  - id: DD-API-007
    type: design-decision
    title: One table of token-read routes, checked in the auth middleware when there is no login
    status: verified
    release: v1.6.43
    description: "TOKEN_READ_ROUTES lists the four routes with their binding (PathId, TokenAgent or None), checked in auth_middleware's GET branch only when [auth] is off; with [auth], login::gate already classes them as signed-in. It reuses agents:read and agents:any, so no new right and no new token kind. The path and token are taken out of the request before the await, because a request body is not Sync."
    fields:
      rationale: "These four carry an agent's captured data, who holds which rights, artifact bytes and the CRDT sync state, and a deployment without [auth] relied only on its reverse proxy's network limit. Fleet status, the registry list and the dashboard stay public without [auth], as REQ-API-002 and REQ-AUTH-001 intend."
    links:
      - type: satisfies
        target: REQ-API-007
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T13:00:00Z

  - id: TEST-API-007
    type: verification
    title: Without [auth], the four sensitive reads refuse no token, a bad token, a missing right and another agent
    status: verified
    release: v1.6.43
    description: "tests/auth.rs without_a_login_sensitive_reads_still_need_an_agent_token: each of the four routes answers 401 with no token and with a non-warte token, 403 for a warte token without agents:read, and passes with agents:read for the token's own agent; another agent's data or access list and an unknown id are 403; agents:any opens them; /api/health, /api/agents and /api/openapi.json stay open. Negative control: removing the check from the middleware failed the test."
    links:
      - type: verifies
        target: REQ-API-007
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-22T13:00:00Z
