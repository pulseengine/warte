    description: "Release pipeline verification: scripts/release-pipeline.sh generates SHA256SUMS, SBOM (cargo-cyclonedx or varve sbom), and cosign signatures locally. .github/workflows/release.yml runs the full pipeline in CI: V-model gate (rivet release status), cross-platform build (Linux + macOS), SHA256SUMS, SBOM, cosign signing, GitHub release creation. The rivet V-model gate blocks the release if any artifact is not verified."
    links:
