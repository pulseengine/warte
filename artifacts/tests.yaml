    description: "Unit tests verify: token issuance and verification roundtrip, expired tokens rejected, invalid format rejected, tampered tokens rejected (signature verification), base64url encoding roundtrip. The auth middleware enforces bearer token auth on all mutating endpoints (POST/PUT/DELETE/PATCH)."
    links:
