# Next release scope against the North Star (pulseengine.eu
# data/north-star.toml). REQ-NS-001 shipped (v1.6.36); the rest are drafts.
# REQ-NS-004 (warte in O2) waits for the owner and is not an artifact yet.
# Plan and checker findings: docs/plans/2026-11-19-north-star-release.md.
# Until rivet has a `serves:` link, each item names its objective in the title.
artifacts:
  - id: REQ-NS-001
    type: requirement
    title: "[O1..O5 visibility] Keep every published indicator observation and show value, change, age and guard on the Overview, later in the night glance"
    status: verified
    release: v1.6.36
    description: "warte SHALL poll pulseengine.eu's public data/north-star/*.json, keep every distinct measured_at observation append-only, and show per objective the value and denominator, the change against the previous observation, the age, the guard's value (or 'guard unmeasured'), and the published blind spot, on GET /api/north-star (public) and as one line on the Overview, later in the night glance (#179). An objective without a file SHALL be 'unmeasured', never 0; an observation older than stale_after_days (45 by default) SHALL show as 'stale'. warte renders and does not compute. No separate Direction view: the line links to the published North Star; pulseengine.eu's own /north-star page is the full view once it is live. Moves no indicator; visibility only."
    fields:
      category: functional
      priority: should
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T21:00:00Z

  - id: REQ-NS-002
    type: requirement
    title: "[O4] Measure time from ready to first pick-up, per kind of picker, never pooled"
    status: draft
    release: v1.8.0
    description: "warte SHALL publish, for open issues in public repositories carrying the ready label, the observed events ready_at, first_pickup_at and pickup_by_kind (person other than the maintainer, agent, maintainer) on GET /api/ready, using its agent registry and sessions to tell agents apart. warte publishes events only; pulseengine.eu's O4 script computes the median per kind, and the O4 figure uses person pick-ups only, reporting n even below 5. Makes the second half of O4's indicator measurable; does not raise merged pull requests by others."
    fields:
      category: functional
      priority: should
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T21:00:00Z

  - id: REQ-NS-003
    type: requirement
    title: "[O3, O5 inputs] Publish which checks are required and the O5 guard observations, never a denominator"
    status: draft
    release: v1.8.0
    description: "warte SHALL publish, per public repository, which checks are required on the default branch, whether each ran in the window, on which runner kind, and whether it has failed at least once; and for O5's guard, whether a gate sits behind a *_GAP switch and whether the equivalence test ran. It SHALL NOT claim to supply O3's or O5's denominator; any indicator built from it marks an absent numerator 'unmeasured', never 0. Cut first if the release runs short."
    fields:
      category: functional
      priority: could
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-19T21:00:00Z

  - id: DD-NS-001
    type: design-decision
    title: warte reads the North Star's published files and renders them; it computes no indicator and publishes only observations it alone can make
    status: verified
    release: v1.6.36
    description: "warte polls pulseengine.eu's public data/north-star.toml and data/north-star/<id>.json over https, keeps each distinct observation append-only, and renders value, change, age, guard and blind spot. An objective without a published file is 'unmeasured' and an observation older than stale_after_days is 'stale'; neither is ever shown as 0. Where warte holds facts no script outside it can see (which picker is an agent, which checks ran on which runner kind), it publishes those events on its read API for pulseengine.eu's scripts to compute from, never a median, a ratio or a denominator."
    fields:
      rationale: "Owner decision 2026-11-12: warte renders indicators and does not compute them, so the published file stays the single source and one number cannot be computed two ways. Pulling public files needs no write scope and no credential in warte. Publishing raw events instead of figures keeps the per-kind split (agent, person, maintainer) in the script that owns O4, where the checker's 'never pooled' finding is enforced once. Rejected: a push endpoint (a write credential on the hub for a public number), a separate Direction view (pulseengine.eu's own /north-star page is the full view), and computing medians in warte."
    links:
      - type: satisfies
        target: REQ-NS-001
      - type: satisfies
        target: REQ-NS-002
      - type: satisfies
        target: REQ-NS-003
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-20T06:30:00Z

  - id: TEST-NS-001
    type: verification
    title: tests/north_star.rs pins unmeasured-never-zero, stale, ordering, refused files, dedup across restarts, removal within one poll and the https-only config
    status: verified
    release: v1.6.36
    description: "Six tests against a local mock of the published files (shapes as of 2026-11-20): five objectives and two files give three 'unmeasured' rows with no value and the glance line 'O2 1/2 (2 d) · O4 1/839 (1 d) · 3 unmeasured'; latest and previous are chosen by time from out-of-order history and 46 days later the row is 'stale'; another objective's file, a missing or unparseable time, non-JSON and a non-O<n> id are refused and control characters stripped; the store keeps one row per objective and time across reopen; a poll names an unreadable file and a file removed by the publisher turns 'unmeasured' after one poll with its history kept; plain http, an interval under 600 s and 0 days are refused. A seventh test reads the live files and runs by hand (--ignored)."
    links:
      - type: verifies
        target: REQ-NS-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-11-20T06:30:00Z
