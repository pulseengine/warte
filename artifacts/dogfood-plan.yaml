  - id: DD-GHSRC-001
    type: design-decision
    title: The GitHub source feeds the ground station's model; one CI source per instance
    status: accepted
    release: v1.5.0
    description: "The GitHub API scan is the smithy agent's queue scan ported to warte (async, configurable base URL) and its result enters the hub as a snapshot (Hub::ingest_snapshot). Views, ETA, admission and watch have one model and one code path whichever source fills it. [hub] and [github] are exclusive: two sources writing one model would make every view wrong."
    fields:
      rationale: "Reported from a GitHub Enterprise Cloud (data residency) deployment: since v1.4.0 the ground station was warte's only CI source, so a team without a smithy agent saw empty views. Reusing the model keeps the agent-facing APIs identical; there is no host view without an agent, so GitHub's busy flag stands in for it."
    links:
