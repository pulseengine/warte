  - id: REQ-QUEUE-002
    type: requirement
    title: "GET /api/admission: open | batch | hold verdict before an agent opens a PR"
    status: implemented
    release: v1.4.1
    description: "warte SHALL serve GET /api/admission?repo=<name>&kind=<docs|fix|feature|security|red-main> returning {verdict: open|batch|hold, reason, recheck_s}. security and red-main SHALL always be open. docs SHALL be batch whenever the repo has runs queued or running. The thresholds for fix and feature SHALL live in warte as named constants. Stale or missing queue data SHALL never produce batch or hold (the verdict is open, with the reason saying so). Unknown kinds SHALL be rejected with 400."
