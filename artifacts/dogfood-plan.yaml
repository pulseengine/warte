    description: The dashboard Ask view SHALL answer for a repo and a PR number or branch with the same answer as the ground station's /api/eta (status, running jobs, queued parts with measured-wait estimate or the reason there is none). It SHALL be a read-only GET usable without authentication, accept the repo with or without the org, and HTML-escape its input and all author-controlled names.
