      model: claude-opus-5-5
      timestamp: 2026-10-28T06:15:13Z

  - id: DD-TRANSPORT-001
    type: design-decision
    title: "Probe telemetry: CCSDS packets over QUIC, sealed per packet with relay-sec"
    status: approved
    release: v1.5.0
    description: Probes dial out to the ground station over QUIC (quinn) with mutual TLS 1.3, one identity per probe. Housekeeping telemetry (relay-ccsds/relay-hk packets) goes in QUIC DATAGRAM frames (RFC 9221, unreliable, no head-of-line blocking); the job ledger, inventory snapshots and later operator commands go on reliable streams. Every packet is also sealed with relay-sec (per-probe SPI, anti-replay), so authenticity survives storage and forwarding beyond the connection. The interface is described in WIT (spar-generated from the AADL model per the feature loop), keeping wRPC's QUIC transport an option. Interoperability with SDLS, Yamcs or CryptoLib is explicitly not a goal.
    fields:
      rationale: "Owner decision, 2026-10-28: CCSDS over QUIC, interoperability with other ground systems not required. Raw UDP authenticates by source IP only (#41) and loses ledger frames silently; QUIC adds mutual authentication, encryption, replay protection, congestion control, connection migration for laptops, and a reliable channel without a CFDP implementation. quinn is already in our audited dependency trees (kiln, sigil), and wRPC's QUIC transport is already in rules_wasm_component. relay-sec stays as the per-packet seal: QUIC protects the link, relay-sec protects the packet after it leaves the link."
    links:
      - type: satisfies
        target: REQ-SEC-001
      - type: satisfies
        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T06:33:43Z

  - id: DD-PROBE-001
    type: design-decision
    title: Agent state comes from the agents' own hooks, not from the terminal
    status: approved
    release: v1.5.0
    description: "warte probe SHALL learn each agent session's state (working, waiting for input, idle, ended) from a small hook it installs in the agent's own config (Claude Code hooks in ~/.claude/settings.json; Copilot CLI hooks in ~/.copilot/hooks/; Codex when its hooks are confirmed). The hook appends {agent, session_id, event, cwd, pid, ts} to a local state file the probe reads. Mapping: UserPromptSubmit/PreToolUse -> working; Notification(permission_prompt)/PermissionRequest -> waiting; Stop -> idle; SessionEnd -> gone. ps finds agents without the hook and their versions. The probe SHALL check that its hook is still installed (Claude Code may rewrite settings.json) and report when it is not."
    fields:
      rationale: "iTerm2 3.7's Session Status (checked on 3.7.6) shows working/waiting/idle per tab, but its Claude Code integration is itself a Claude Code hook: a small binary (~/.config/iterm2/cc-status) on ten hook events that runs 'it2 session set-status'. It needs macOS, iTerm2 running and its Python API enabled; with the API off the hook fails silently on every event. Status can be read back ('it2 session get-status --json', 'it2 session list', tmux panes via --tmux/--tmux-pane), so on Macs with the API enabled the probe MAY read it as a second source. The agents' hook events stay the source of truth: they work on every OS and terminal. OTel export has usage counters but no live state. Sources: iterm2.com/documentation-session-status.html, iterm2.com/claude-code-integration.html, code.claude.com/docs/en/hooks, docs.github.com copilot-cli hooks reference."
    links:
      - type: satisfies
        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T19:16:20Z

  - id: DD-PROBE-002
    type: design-decision
    title: Probes enroll with a one-time token; the probe makes its own key
    status: approved
    release: v1.5.0
    description: The operator runs 'warte probe token' on the ground station, which prints a short-lived single-use token; on the machine, 'warte probe enroll <token> --ground <address>' generates the probe's key locally, sends a certificate request with the token, and receives a certificate signed by warte's CA plus its relay-sec SPI. The private key never leaves the machine. Tokens expire (default 15 min), are single use, and are stored hashed. Ansible (smithy) runs the same two commands for hosts it manages.
    fields:
      rationale: Owner decision 2026-10-28. Works the same for Macs, Pis and Hetzner, by hand or by Ansible; keys never travel, unlike pushing certificates; and an explicit operator step, unlike trust on first use, is the security boundary for a new probe.
    links:
      - type: satisfies
        target: REQ-SEC-001
      - type: satisfies
        target: REQ-PROBE-001
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T19:26:32Z

  - id: DD-PROBE-003
    type: design-decision
    title: The probe offers its agent hooks; the user confirms
    status: approved
    release: v1.5.0
    description: "'warte probe install-hooks' shows the exact change to each agent's config (Claude Code ~/.claude/settings.json, Copilot CLI ~/.copilot/hooks/) and writes it only after confirmation; it keeps existing hooks (including iTerm2's cc-status) and backs the file up first. The probe never edits agent config on its own; it reports when its hook is missing (Claude Code can rewrite settings.json) and the dashboard shows that machine's agent state as unknown."
    fields:
      rationale: "Owner decision 2026-10-28: nothing edits a developer's agent config silently. A missing hook is reported, not repaired."
    links:
