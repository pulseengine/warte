  - id: DD-SEC-002
    type: design-decision
    title: "Fleet security on our own stack: relay-sec for telemetry, sigil for binaries, varve for installs"
    status: approved
    release: v1.5.0
    description: Probe-to-ground telemetry uses relay-sec (one SPI per probe). Release binaries are signed with sigil and attested. warte and the probe ship in the varve layer, so every machine installs a verified, digest-pinned build; deploys install from the layer.
    fields:
      rationale: "Owner direction, 2026-10-28: use relay and sigil, not new code. relay-sec already provides Kani-proved anti-replay and authenticated frames for exactly this transport. sigil and varve already give signed, attested, rollback-protected distribution. A warte-specific MAC scheme or install path would add a second trust path to audit."
    links:
