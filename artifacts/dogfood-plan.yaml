  - id: DD-SMITHY-001
    type: design-decision
    title: "warte absorbs smithy hub: CCSDS ingest, ledger, ETA and the hub API move into warte"
    status: approved
    release: v1.4.0
    description: "warte becomes the ground station. It receives the smithy agent's CCSDS telemetry over UDP (relay-ccsds), keeps the per-day JSONL ledger and hub state, computes ETA from measured waits, and serves the hub's API. The smithy agent stays on the CI host. warte's own poller, CI webhooks, eta module and SQLite telemetry tables are removed. Cut-over: run side by side (agent sends to both), compare /api/eta and /status.md, then retire smithy-hub.service on the ground-station host."
    fields:
      rationale: "Decided by the project owner on 2026-10-27 (#36): one control tower instead of two dashboards. smithy hub is live and measured (14 runners, 35-day ledger, ETA from measured pool waits), while warte's copy was unit-tested only. Absorbing the hub's code and formats, instead of re-deriving them, keeps the measured behaviour. Its ledger also gives warte telemetry storage that needs no SQL. Licensing: both are PulseEngine-owned and Apache-2.0 (DD-LICENSE-001), so hub code moves across unchanged."
    links:
      - type: satisfies
        target: REQ-SMITHY-001
      - type: satisfies
        target: REQ-SMITHY-002
      - type: satisfies
        target: REQ-SMITHY-003
      - type: satisfies
        target: REQ-SMITHY-004
      - type: satisfies
        target: REQ-MIGRATE-001
      - type: traces-to
        target: DD-ARCH-009
      - type: satisfies
        target: REQ-ASK-004
      - type: satisfies
        target: REQ-DASH-014
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-27T19:36:18Z

