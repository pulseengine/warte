    type: asset
    title: CI fleet telemetry and ledger (ground station state)
    status: draft
    description: hub-state.json (latest snapshot, per-minute history) and the per-day JSONL ledger of finished jobs, fed by the smithy agent's CCSDS telemetry. Agents schedule work on /api/eta answered from it; the monthly report is computed from it.
