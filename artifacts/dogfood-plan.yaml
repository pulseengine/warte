    description: In a browser, every dashboard view SHALL render non-empty content without script errors; Ask SHALL show its form and the ground station's answer. The page SHALL load nothing from other origins (htmx is served by warte), SHALL work behind a path prefix (https://fourpi.local/warte/), and SHALL NOT claim a live connection that does not exist. Verified by the Playwright suite in tests/playwright, run in CI.
