  - id: REQ-CI-004
    type: requirement
    title: Superseded PR CI runs are cancelled; main and release runs never are
    status: implemented
    release: v1.4.1
    description: A new push to a pull request SHALL cancel that PR's older CI runs, so stale commits don't hold the shared smithy runners. Runs for pushes to main and release/** SHALL never be cancelled.
    fields:
      category: non-functional
      priority: should
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
