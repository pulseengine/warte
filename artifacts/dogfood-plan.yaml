  - id: REQ-WATCH-001
    type: requirement
    title: warte watch blocks until something relevant changes, then exits
    status: verified
    release: v1.4.1
    description: warte watch SHALL block until a watched condition changes and then exit 0 with a JSON description of the change and a cursor. The first condition is --ci (a PR's or branch's CI runs start or finish), with --repo plus --pr or --branch. It SHALL exit with a distinct code when --timeout expires with no change, 1 on error and 2 on usage errors, and accept --since <cursor> so no change is missed between two calls. Agents (Claude Code, Copilot CLI, cron) run it as a background command and are woken only when it exits.
    fields:
      category: interface
      priority: must
      upstream-ref: https://github.com/pulseengine/warte/issues/16
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T04:59:06Z

  - id: REQ-WATCH-002
    type: requirement
    title: Long-poll /api/watch, woken by the ground station's snapshots
    status: verified
    release: v1.4.1
    description: warte SHALL expose GET /api/watch?repo=&(pr=|branch=)&since=<cursor>&timeout=<s>, which answers at once when the PR's or branch's CI state (its runs, each queued or running) differs from the cursor, and otherwise holds until a new ground-station snapshot changes it or the timeout passes. The cursor SHALL encode the state itself, so a caller resuming with an old cursor cannot miss a change and the server keeps no event log. Holds SHALL be bounded (at most 900 s, at most 64 at once); invalid input SHALL be refused, not held.
    fields:
      category: interface
      priority: must
      upstream-ref: https://github.com/pulseengine/warte/issues/16
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T04:59:06Z

  - id: DD-WATCH-001
    type: design-decision
    title: Agents wait on a blocking CLI, not on channels or polling
    status: accepted
    release: v1.4.1
    description: warte watch is a blocking command over a long-poll endpoint. It works unchanged for Claude Code (background command, woken on exit), Copilot CLI (shell or SDK wrapper calling session.send) and cron agents.
    fields:
      rationale: "Claude Code channels are a research preview, need allow-listing, and don't register for headless sessions; Copilot has no equivalent, only SDK session.send for SDK-driven sessions. A blocking CLI needs neither, costs no tokens while waiting, and replaces the hand-written gh pr checks loops agents use today. The cursor is the watched state (status + digest of runs), not an event sequence number: with telemetry arriving once a minute, a state comparison is exact at that resolution, needs no retention window, and cannot lose events across a server restart; the realtime broadcaster is not needed for this. Inbox messages and advisories become further conditions on the same endpoint."
    links:
      - type: satisfies
        target: REQ-WATCH-001
      - type: satisfies
        target: REQ-WATCH-002
    provenance:
      created-by: ai-assisted
      model: claude-opus-5-5
      timestamp: 2026-10-28T04:59:06Z

