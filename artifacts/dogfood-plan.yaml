    description: "CI job, wait and status data SHALL NOT be kept in warte's SQLite database. It lives in the ground station: hub-state.json and the per-day JSONL ledger, which can be rebuilt from GitHub, the store of record. The ci_jobs, wait_history and ci_status tables SHALL be dropped, and no code SHALL read or write them."
    fields:
