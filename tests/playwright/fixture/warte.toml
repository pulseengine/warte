# warte serve for the Playwright suite: a ground station loaded from the
# synthetic hub-state.json (regenerate: cargo test --test fleet_views --
# --ignored regenerate_playwright_fixture). No telemetry arrives.
bind = "127.0.0.1:3013"
# the Critical Path view's chain (REQ-CRIT-001); spar has CI queued in the fixture
repo_dependencies = [
  { repo = "jess", depends_on = ["rivet"] },
  { repo = "rivet", depends_on = ["spar"] },
]

[hub]
udp = "127.0.0.1:0"
allow = ["127.0.0.1"]
data_dir = "hub"
# the fixture must not probe the machine running the tests
probe_self = false

[jobs]
dir = "jobs"
expected = "jobs-expected"
hosts = { "netcup-vps" = "netcup" }
