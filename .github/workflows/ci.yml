name: CI

on:
  push:
    # release/** too: a release commit gets CI on its exact SHA (a PR from a
    # release branch cut from an older tag conflicts with main and never runs)
    branches: [main, 'release/**']
  # every pull request, whatever its base, and the merge queue: no paths or
  # branch filter on a workflow hosting a required context (jig, sieve)
  pull_request:
  merge_group:

# Least privilege: GITHUB_TOKEN reads the repository and nothing else. No job
# here writes (actions/cache and upload-artifact use the runner's runtime
# token), and jig's workflows declare contents: read themselves. A job that
# needs more gets it at job level, with the reason beside it.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR cancels that PR's older runs, so stale commits don't hold
# scarce self-hosted runners. Pushes to main and release/** are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rivet v0.43.3 — the rivet in the varve layer pinned by varve.toml (2026.11.36).
  # Must match release.yml (tests/ci_workflows.rs checks this).
  RIVET_REV: 3422f42e8461b17ec08dcfb6be215535cc9ede38

jobs:
  build:
    name: Build
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # self-hosted runner-group policy and fork-PR approval (#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --workspace --verbose

  clippy:
    name: Clippy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # warte's report validators as a WASI p2 component (owner, 2026-11-27, "run
  # what we build"): crates/warte-check builds for wasm32-wasip2, its tests run
  # under wasmtime, and the release component must accept a good report and
  # refuse a planted bad one. Not a required check yet. The `kiln` job below
  # runs the same component through meld and kiln, advisory.
  component:
    name: WASI component
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      WASMTIME_VERSION: v42.0.1
      WASMTIME_SHA256: dd5253f3cb521bb094f9951c3d2c45c746b31e5723b07ce56f162ec9bab44d59
      # exit-with-code lets the component report 2 (usage or read error) apart from 1
      CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime run -S cli-exit-with-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Fetch pinned wasmtime
        run: |
          d="$RUNNER_TEMP/wasmtime"; mkdir -p "$d"; cd "$d"
          a="wasmtime-$WASMTIME_VERSION-x86_64-linux.tar.xz"
          curl -fsSL -o "$a" "https://github.com/bytecodealliance/wasmtime/releases/download/$WASMTIME_VERSION/$a"
          echo "$WASMTIME_SHA256  $a" | sha256sum -c -
          tar -xJf "$a" --strip-components=1
          echo "$d" >> "$GITHUB_PATH"

      - name: Test warte-check under wasmtime
        run: cargo test --locked -p warte-check --target wasm32-wasip2

      - name: Build the component
        run: cargo build --locked -p warte-check --target wasm32-wasip2 --release

      - name: The component accepts good reports and refuses the planted one
        run: |
          run() { wasmtime run -S cli-exit-with-code --dir=. target/wasm32-wasip2/release/warte-check.wasm "$@"; }
          f=crates/warte-check/tests/fixtures
          run temper-report "$f/temper-report.good.json"
          run architecture tests/fixtures/architecture.example.json
          set +e
          run temper-report "$f/temper-report.planted-bad.json"; bad=$?
          run architecture missing.json; missing=$?
          set -e
          echo "planted bad report: exit $bad (want 1); missing file: exit $missing (want 2)"
          test "$bad" -eq 1 && test "$missing" -eq 2

  # The same component through PulseEngine's own chain (owner, 2026-11-27):
  # meld fuses it into a core module (--reproducible, fused twice and compared)
  # and kiln runs it with the same 0/1/2 expectations as wasmtime above.
  # meld, kiln and wasmtime come from the covalent layer pinned in
  # tools/chain/varve.toml, installed cosign-verified into a job-local root.
  # Advisory in `required`: a red run here is a finding about the chain.
  # rivet: verifies REQ-COMPONENT-001
  kiln:
    name: kiln run
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Job-local, never ~/.varve: on a persistent runner another repository's
      # newer layer leaves an anti-rollback mark that refuses this pin.
      - name: A fresh varve root for this job
        run: |
          echo "VARVE_ROOT=$RUNNER_TEMP/varve" >> "$GITHUB_ENV"
          echo "VARVE_INSTALL_DIR=$RUNNER_TEMP/varve/bin" >> "$GITHUB_ENV"

      - name: Install varve (cosign-verified) and the pinned layer
        working-directory: tools/chain
        env:
          VARVE_VERSION: v0.47.0
        run: bash ../../scripts/install-varve.sh

      - name: The chain's tools resolve to the pinned layer
        working-directory: tools/chain
        run: |
          set -euo pipefail
          for t in wasmtime meld kiln; do
            test "$(command -v "$t")" = "$VARVE_ROOT/shims/$t"
            "$VARVE_INSTALL_DIR/varve" which "$t"
          done
          meld --version
          kiln --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the component
        run: cargo build --locked -p warte-check --target wasm32-wasip2 --release

      - name: The component asks for exit-with-code
        run: grep -aq exit-with-code target/wasm32-wasip2/release/warte-check.wasm

      - name: meld fuses it reproducibly
        working-directory: tools/chain
        run: |
          set -euo pipefail
          c="$GITHUB_WORKSPACE/target/wasm32-wasip2/release/warte-check.wasm"
          o="$RUNNER_TEMP/chain"; mkdir -p "$o"
          meld fuse --reproducible --memory multi "$c" -o "$o/a.core.wasm"
          meld fuse --reproducible --memory multi "$c" -o "$o/b.core.wasm"
          cmp "$o/a.core.wasm" "$o/b.core.wasm"
          sha256sum "$o/a.core.wasm"

      # kiln 0.9.0 hung on other repositories' Linux runners (kiln#748): each
      # call gets 120 s, and a timeout (124) is reported as a hang by name.
      # kiln 0.9.0 read nothing through a `--dir HOST::GUEST` preopen, so the
      # inputs are copied under the pinned directory (shims refuse outside it)
      # and opened relative to `--dir .`, as in the wasmtime job.
      - name: kiln accepts good reports and refuses the planted one
        working-directory: tools/chain
        timeout-minutes: 10
        run: |
          set -eu
          d=run; rm -rf "$d"; mkdir "$d"
          f="$GITHUB_WORKSPACE/crates/warte-check/tests/fixtures"
          cp "$f/temper-report.good.json" "$f/temper-report.planted-bad.json" "$d/"
          cp "$GITHUB_WORKSPACE/tests/fixtures/architecture.example.json" "$d/"
          cp "$RUNNER_TEMP/chain/a.core.wasm" "$d/warte-check.core.wasm"
          cd "$d"
          run() {
            timeout 120 kiln --wasi --dir . warte-check.core.wasm "$@"
            rc=$?
            if [ "$rc" -eq 124 ]; then echo "kiln hung (kiln#748) on: $*"; fi
            return "$rc"
          }
          set +e
          run temper-report temper-report.good.json; good=$?
          run architecture architecture.example.json; arch=$?
          run temper-report temper-report.planted-bad.json; bad=$?
          run architecture missing.json; missing=$?
          set -e
          echo "good report $good (want 0), architecture $arch (want 0), planted bad $bad (want 1), missing $missing (want 2)"
          test "$good" -eq 0 && test "$arch" -eq 0 && test "$bad" -eq 1 && test "$missing" -eq 2

  rivet:
    name: Rivet traceability check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache rivet binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rivet
          key: rivet-${{ runner.os }}-${{ env.RIVET_REV }}

      # Job-scoped install: never trust a rivet left in $HOME by an earlier job
      # on a persistent runner. Restored from this repo's cache or rebuilt from
      # the pinned rev, then checked before it goes on PATH.
      - name: Install rivet (pinned rev, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          if [ ! -x "$ROOT/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" \
              --root "$ROOT" \
              --bin rivet \
              rivet-cli
          fi
          "$ROOT/bin/rivet" --version | grep -q "^rivet 0.43.3 (${RIVET_REV:0:8}"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Validate rivet artifacts
        run: rivet validate

      - name: Check traceability coverage
        run: rivet coverage --fail-under 71 --strict-empty

  # Every committed lockfile is audited (REQ-CI-007); tests/ci_workflows.rs
  # checks that each one has a step here. The planted controls run first, so a
  # gate that cannot fail is red rather than quietly green.
  audit:
    name: Dependency audit
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.1

      - name: Install cargo-audit (pinned, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/cargo-audit"
          if [ ! -x "$ROOT/bin/cargo-audit" ]; then
            cargo install --locked --version 0.22.1 --root "$ROOT" cargo-audit
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Planted controls (a stale lock and known advisories must fail)
        run: |
          tmp="$(mktemp -d)"
          # a Cargo.lock out of date with its Cargo.toml fails --locked
          mkdir "$tmp/stale"
          git archive HEAD | tar -x -C "$tmp/stale"
          sed -i '0,/^version = "\(.*\)"/s//version = "\1-planted"/' "$tmp/stale/Cargo.toml"
          if cargo metadata --locked --format-version 1 --manifest-path "$tmp/stale/Cargo.toml" >/dev/null 2>"$tmp/stale.err"; then
            echo "::error::a Cargo.lock out of date with Cargo.toml passed --locked"; exit 1
          fi
          grep -q -- "--locked" "$tmp/stale.err" || { cat "$tmp/stale.err"; exit 1; }
          # a lock holding smallvec 1.6.0 (RUSTSEC-2021-0003) fails cargo audit
          printf '%s\n' 'version = 4' '' '[[package]]' 'name = "smallvec"' 'version = "1.6.0"' \
            'source = "registry+https://github.com/rust-lang/crates.io-index"' > "$tmp/planted.lock"
          if cargo audit --file "$tmp/planted.lock" >"$tmp/cargo.out" 2>&1; then
            echo "::error::cargo audit passed a lock with RUSTSEC-2021-0003"; exit 1
          fi
          grep -q RUSTSEC-2021-0003 "$tmp/cargo.out" || { cat "$tmp/cargo.out"; exit 1; }
          # a package-lock holding minimist 1.2.5 (GHSA-xvch-5gv4-984h) fails npm audit
          mkdir "$tmp/npm"
          printf '%s\n' '{"name":"planted","version":"0.0.0","dependencies":{"minimist":"1.2.5"}}' > "$tmp/npm/package.json"
          printf '%s\n' '{"name":"planted","version":"0.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"planted","version":"0.0.0","dependencies":{"minimist":"1.2.5"}},"node_modules/minimist":{"version":"1.2.5","resolved":"https://registry.npmjs.org/minimist/-/minimist-1.2.5.tgz"}}}' > "$tmp/npm/package-lock.json"
          if (cd "$tmp/npm" && npm audit --audit-level=high --package-lock-only) >"$tmp/npm.out" 2>&1; then
            echo "::error::npm audit passed a lock with minimist 1.2.5"; exit 1
          fi
          grep -q minimist "$tmp/npm.out" || { cat "$tmp/npm.out"; exit 1; }
          echo "planted controls failed as they must: stale lock, RUSTSEC-2021-0003, minimist 1.2.5"

      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock

      - name: Audit tests/playwright/package-lock.json
        working-directory: tests/playwright
        run: npm audit --audit-level=high --package-lock-only

  # Browser E2E (tests/playwright), modelled on rivet's job. Hosted, not
  # self-hosted: `playwright install --with-deps` needs apt-get (sudo), which the
  # self-hosted runners don't have. Pinned to ubuntu-24.04 as rivet does: the
  # pinned Playwright release does not support Ubuntu 26.04.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          if-no-files-found: ignore

  # jig, the shared CI baseline, in shadow mode (phase 1): guard, pins,
  # supply and planted controls run beside warte's own jobs. Since 2026-11-27
  # `required / verdict` and `baseline / guard` are required contexts beside
  # warte's own five (.github/required-contexts.txt).
  # Both jig calls pin the same full SHA: jig v0.1.8's record commit (the one
  # that records its archive sha256s), not its tag commit.
  baseline:
    uses: pulseengine/jig/.github/workflows/baseline.yml@5458397bb99ef86ec0ed6422b3a192bb64eec035
    with:
      audit: cargo-audit
      guard-config: plant-guard.toml
      controls-only: "lock-stale toolchain-floating guard-unguarded verdict-sees-failure"
      # Off on purpose: warte's own private names are enforced exactly, by hash, in
      # tests/public_names.rs, and generic shapes (private IPv4, .lan/.local/
      # .internal hosts) match dozens of deliberate examples in docs and tests.
      names-patterns: none

  # sieve's path classifier, as warte's own job. Shadow mode: no job reads its
  # outputs yet, so everything still runs; the verdict is recorded to count
  # what sieve would have skipped. sieve v0.4.5 by version and sha256 (from
  # its cosign-verified SHA256SUMS.txt, 2026-11-26).
  classify:
    name: classify
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      SIEVE_VERSION: v0.4.5
      SIEVE_SHA256: 42971f93e7784e9ae33cee59693ca6a901b681b657b11ed3337465a5c471af13
    outputs:
      run_all: ${{ steps.classify.outputs.run_all }}
      rust: ${{ steps.classify.outputs.rust }}
      rivet: ${{ steps.classify.outputs.rivet }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch pinned sieve
        run: |
          d="$RUNNER_TEMP/sieve"; mkdir -p "$d"; cd "$d"
          a="sieve-$SIEVE_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$a" "https://github.com/pulseengine/sieve/releases/download/$SIEVE_VERSION/$a"
          echo "$SIEVE_SHA256  $a" | sha256sum -c -
          tar -xzf "$a"
          echo "$d" >> "$GITHUB_PATH"
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: sieve classify --config sieve.toml --event "$EVENT" --base "$BASE_SHA" --format github-output --explain

  # Advisory canary: the next Rust release, before it reaches the pinned
  # build as a reviewed change. jig pins accepts `stable` only in this shape
  # (job-level continue-on-error: true, needed by no job but `required`, and
  # named in the verdict's advisory), and the verdict reports it by name
  # without turning red on it.
  canary-stable:
    name: canary-stable
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Build and test on stable
        run: |
          rustc --version
          cargo build --locked --all-targets
          cargo test --locked

  # The one context that will replace the list: red on any failure,
  # cancellation, skip of a selected class or a job missing from needs.
  required:
    needs: [baseline, classify, build, clippy, component, kiln, rivet, audit, playwright, canary-stable]
    if: always()
    uses: pulseengine/jig/.github/workflows/required.yml@5458397bb99ef86ec0ed6422b3a192bb64eec035
    with:
      needs-json: ${{ toJSON(needs) }}
      never-skip: "build clippy component rivet audit playwright"
      advisory: "canary-stable kiln"
