name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rivet v0.41.1 — the rivet in the varve layer pinned by varve.toml (2026.10.30).
  # Must match release.yml (tests/ci_workflows.rs checks this).
  RIVET_REV: 29ca43828c8060af135fcd47ecff4c48662d1567

jobs:
  build:
    name: Build
    # Fork PRs never run on the shared smithy pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    name: Clippy
    # Fork PRs never run on the shared smithy pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  rivet:
    name: Rivet traceability check
    # Fork PRs never run on the shared smithy pool.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache rivet binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rivet
          key: rivet-${{ runner.os }}-${{ env.RIVET_REV }}

      # Job-scoped install: never trust a rivet left in $HOME by an earlier job
      # on a persistent runner. Restored from this repo's cache or rebuilt from
      # the pinned rev, then checked before it goes on PATH.
      - name: Install rivet (pinned rev, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          if [ ! -x "$ROOT/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" \
              --root "$ROOT" \
              --bin rivet \
              rivet-cli
          fi
          "$ROOT/bin/rivet" --version | grep -q "^rivet 0.41.1 (${RIVET_REV:0:8}"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Validate rivet artifacts
        run: rivet validate

      - name: Check traceability coverage
        run: rivet coverage
