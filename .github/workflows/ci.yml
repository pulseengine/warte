name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rivet v0.41.1 — the rivet in the varve layer pinned by varve.toml (2026.10.30).
  # Must match release.yml (tests/ci_workflows.rs checks this).
  RIVET_REV: 29ca43828c8060af135fcd47ecff4c48662d1567

jobs:
  build:
    name: Build
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (#35).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    name: Clippy
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  rivet:
    name: Rivet traceability check
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache rivet binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rivet
          key: rivet-${{ runner.os }}-${{ env.RIVET_REV }}

      # Job-scoped install: never trust a rivet left in $HOME by an earlier job
      # on a persistent runner. Restored from this repo's cache or rebuilt from
      # the pinned rev, then checked before it goes on PATH.
      - name: Install rivet (pinned rev, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          if [ ! -x "$ROOT/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" \
              --root "$ROOT" \
              --bin rivet \
              rivet-cli
          fi
          "$ROOT/bin/rivet" --version | grep -q "^rivet 0.41.1 (${RIVET_REV:0:8}"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Validate rivet artifacts
        run: rivet validate

      - name: Check traceability coverage
        run: rivet coverage

  # Browser E2E (tests/playwright), modelled on rivet's job. Hosted, not
  # smithy: `playwright install --with-deps` needs apt-get (sudo), which the
  # smithy runners don't have. Pinned to ubuntu-24.04 as rivet does: the
  # pinned Playwright release does not support Ubuntu 26.04.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          if-no-files-found: ignore
