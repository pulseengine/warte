name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  rivet:
    name: Rivet traceability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install varve
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          cargo install varve-cli --locked 2>/dev/null || true

      - name: Install rivet
        run: cargo install rivet-cli --locked 2>/dev/null || cargo install --git https://github.com/pulseengine/rivet --locked

      - name: Validate rivet artifacts
        run: rivet validate

      - name: Check traceability coverage
        run: rivet coverage

  release-check:
    name: Release readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install rivet
        run: cargo install rivet-cli --locked 2>/dev/null || cargo install --git https://github.com/pulseengine/rivet --locked

      - name: Check release readiness
        run: rivet release status v0.1.0 || true
