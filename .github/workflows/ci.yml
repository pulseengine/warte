name: CI

on:
  push:
    # release/** too: a release commit gets CI on its exact SHA (a PR from a
    # release branch cut from an older tag conflicts with main and never runs)
    branches: [main, 'release/**']
  # every pull request, whatever its base, and the merge queue: no paths or
  # branch filter on a workflow hosting a required context (jig, sieve)
  pull_request:
  merge_group:

defaults:
  run:
    shell: bash

# A new push to a PR cancels that PR's older runs, so stale commits don't hold
# scarce self-hosted runners. Pushes to main and release/** are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rivet v0.41.1 — the rivet in the varve layer pinned by varve.toml (2026.10.30).
  # Must match release.yml (tests/ci_workflows.rs checks this).
  RIVET_REV: 29ca43828c8060af135fcd47ecff4c48662d1567

jobs:
  build:
    name: Build
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # self-hosted runner-group policy and fork-PR approval (#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

  clippy:
    name: Clippy
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  rivet:
    name: Rivet traceability check
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0

      - name: Cache rivet binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/rivet
          key: rivet-${{ runner.os }}-${{ env.RIVET_REV }}

      # Job-scoped install: never trust a rivet left in $HOME by an earlier job
      # on a persistent runner. Restored from this repo's cache or rebuilt from
      # the pinned rev, then checked before it goes on PATH.
      - name: Install rivet (pinned rev, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          if [ ! -x "$ROOT/bin/rivet" ]; then
            cargo install --locked --git https://github.com/pulseengine/rivet \
              --rev "$RIVET_REV" \
              --root "$ROOT" \
              --bin rivet \
              rivet-cli
          fi
          "$ROOT/bin/rivet" --version | grep -q "^rivet 0.41.1 (${RIVET_REV:0:8}"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - name: Validate rivet artifacts
        run: rivet validate

      - name: Check traceability coverage
        run: rivet coverage --fail-under 71 --strict-empty

  # Every committed lockfile is audited (REQ-CI-007); tests/ci_workflows.rs
  # checks that each one has a step here. The planted controls run first, so a
  # gate that cannot fail is red rather than quietly green.
  audit:
    name: Dependency audit
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0

      - name: Cache cargo-audit binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.1

      - name: Install cargo-audit (pinned, job-scoped)
        run: |
          ROOT="$RUNNER_TEMP/cargo-audit"
          if [ ! -x "$ROOT/bin/cargo-audit" ]; then
            cargo install --locked --version 0.22.1 --root "$ROOT" cargo-audit
          fi
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Planted controls (a stale lock and known advisories must fail)
        run: |
          tmp="$(mktemp -d)"
          # a Cargo.lock out of date with its Cargo.toml fails --locked
          mkdir "$tmp/stale"
          git archive HEAD | tar -x -C "$tmp/stale"
          sed -i '0,/^version = "\(.*\)"/s//version = "\1-planted"/' "$tmp/stale/Cargo.toml"
          if cargo metadata --locked --format-version 1 --manifest-path "$tmp/stale/Cargo.toml" >/dev/null 2>"$tmp/stale.err"; then
            echo "::error::a Cargo.lock out of date with Cargo.toml passed --locked"; exit 1
          fi
          grep -q -- "--locked" "$tmp/stale.err" || { cat "$tmp/stale.err"; exit 1; }
          # a lock holding smallvec 1.6.0 (RUSTSEC-2021-0003) fails cargo audit
          printf '%s\n' 'version = 4' '' '[[package]]' 'name = "smallvec"' 'version = "1.6.0"' \
            'source = "registry+https://github.com/rust-lang/crates.io-index"' > "$tmp/planted.lock"
          if cargo audit --file "$tmp/planted.lock" >"$tmp/cargo.out" 2>&1; then
            echo "::error::cargo audit passed a lock with RUSTSEC-2021-0003"; exit 1
          fi
          grep -q RUSTSEC-2021-0003 "$tmp/cargo.out" || { cat "$tmp/cargo.out"; exit 1; }
          # a package-lock holding minimist 1.2.5 (GHSA-xvch-5gv4-984h) fails npm audit
          mkdir "$tmp/npm"
          printf '%s\n' '{"name":"planted","version":"0.0.0","dependencies":{"minimist":"1.2.5"}}' > "$tmp/npm/package.json"
          printf '%s\n' '{"name":"planted","version":"0.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"planted","version":"0.0.0","dependencies":{"minimist":"1.2.5"}},"node_modules/minimist":{"version":"1.2.5","resolved":"https://registry.npmjs.org/minimist/-/minimist-1.2.5.tgz"}}}' > "$tmp/npm/package-lock.json"
          if (cd "$tmp/npm" && npm audit --audit-level=high --package-lock-only) >"$tmp/npm.out" 2>&1; then
            echo "::error::npm audit passed a lock with minimist 1.2.5"; exit 1
          fi
          grep -q minimist "$tmp/npm.out" || { cat "$tmp/npm.out"; exit 1; }
          echo "planted controls failed as they must: stale lock, RUSTSEC-2021-0003, minimist 1.2.5"

      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock

      - name: Audit tests/playwright/package-lock.json
        working-directory: tests/playwright
        run: npm audit --audit-level=high --package-lock-only

  # Browser E2E (tests/playwright), modelled on rivet's job. Hosted, not
  # self-hosted: `playwright install --with-deps` needs apt-get (sudo), which the
  # self-hosted runners don't have. Pinned to ubuntu-24.04 as rivet does: the
  # pinned Playwright release does not support Ubuntu 26.04.
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: tests/playwright
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/playwright/test-results/
          if-no-files-found: ignore

  # jig, the shared CI baseline, in shadow mode (phase 1): guard, pins,
  # supply and planted controls run beside warte's own jobs. Nothing here is
  # a required context yet; Build, Clippy, Rivet traceability check and
  # Playwright E2E stay required until the owner adds `required / verdict`.
  # Both jig calls pin the same full SHA (jig v0.1.0 with plant v0.4.0).
  baseline:
    uses: pulseengine/jig/.github/workflows/baseline.yml@3e575e0f0ae507b817ff0a89b93ed1d5442df769
    with:
      audit: cargo-audit
      guard-config: plant-guard.toml
      controls-only: "lock-stale toolchain-floating guard-unguarded verdict-sees-failure"

  # sieve's path classifier, as warte's own job. Shadow mode: no job reads its
  # outputs yet, so everything still runs; the verdict is recorded to count
  # what sieve would have skipped. sieve v0.3.0 by version and sha256 (from
  # its cosign-verified SHA256SUMS.txt, 2026-11-21).
  classify:
    name: classify
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      SIEVE_VERSION: v0.3.0
      SIEVE_SHA256: aae674edf2c454ae5047409f571160f4615ef67f901b2e55628e8b756fb69b40
    outputs:
      run_all: ${{ steps.classify.outputs.run_all }}
      rust: ${{ steps.classify.outputs.rust }}
      rivet: ${{ steps.classify.outputs.rivet }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch pinned sieve
        run: |
          d="$RUNNER_TEMP/sieve"; mkdir -p "$d"; cd "$d"
          a="sieve-$SIEVE_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$a" "https://github.com/pulseengine/sieve/releases/download/$SIEVE_VERSION/$a"
          echo "$SIEVE_SHA256  $a" | sha256sum -c -
          tar -xzf "$a"
          echo "$d" >> "$GITHUB_PATH"
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: sieve classify --config sieve.toml --event "$EVENT" --base "$BASE_SHA" --format github-output --explain

  # The one context that will replace the list: red on any failure,
  # cancellation, skip of a selected class or a job missing from needs.
  required:
    needs: [baseline, classify, build, clippy, rivet, audit, playwright]
    if: always()
    uses: pulseengine/jig/.github/workflows/required.yml@3e575e0f0ae507b817ff0a89b93ed1d5442df769
    with:
      needs-json: ${{ toJSON(needs) }}
      never-skip: "build clippy rivet audit playwright"
