name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # rivet v0.41.1 — must match ci.yml (tests/ci_workflows.rs checks this).
  RIVET_REV: 29ca43828c8060af135fcd47ecff4c48662d1567
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

# Release jobs sign (cosign/OIDC) and publish, so they run on ephemeral
# GitHub-hosted runners, never on the shared runner pool, and restore no caches
# (a cache written by a shared-pool run on main would otherwise reach a tag run).
jobs:
  release-gate:
    name: V-model traceability gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No cache here: main's CI runs on the shared runner pool and writes caches
      # a tag run could restore. The release gate always builds rivet from the
      # pinned rev.
      - name: Install rivet (pinned rev, job-scoped, uncached)
        run: |
          ROOT="$RUNNER_TEMP/rivet"
          cargo install --locked --git https://github.com/pulseengine/rivet \
            --rev "$RIVET_REV" \
            --root "$ROOT" \
            --bin rivet \
            rivet-cli
          "$ROOT/bin/rivet" --version | grep -q "^rivet 0.41.1 (${RIVET_REV:0:8}"
          echo "$ROOT/bin" >> "$GITHUB_PATH"

      # rivet exits non-zero unless every artifact scoped to this release is verified.
      - name: Check release readiness
        run: rivet release status "$TAG"

  build:
    name: Build release artifacts
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
          # the probes on the Raspberry Pis (and the ground station)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: linux-arm64
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check binary version equals tag
        run: |
          got="$("target/${{ matrix.target }}/release/warte" --version)"
          if [ "$got" != "warte ${TAG#v}" ]; then
            echo "warte --version reports '$got', expected 'warte ${TAG#v}'"
            exit 1
          fi

      - name: Check the probe can enroll and send
        # A release without these broke a probe host once (v1.4.0 has only
        # `probe report`); the probe hosts install releases only.
        run: |
          help="$("target/${{ matrix.target }}/release/warte" probe --help)"
          for cmd in enroll send hook; do
            if ! printf '%s\n' "$help" | grep -qE "^  $cmd( |$)"; then
              echo "warte probe has no '$cmd' subcommand; refusing to release"
              exit 1
            fi
          done

      - name: Package binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/warte" "dist/warte-${TAG#v}-${{ matrix.asset }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warte-${{ matrix.target }}
          path: dist/

  # The operator kit (REQ-OPS-004): deploy/operator/ exactly as committed at
  # the tag, so an operator fetches and verifies it like the binary. Named
  # operator-kit-*, not warte-*: varve's layer deposit reads warte-* as
  # platform binaries.
  operator-kit:
    name: Package the operator kit
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Package deploy/operator
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="operator-kit-$v/" -o "dist/operator-kit-$v.tar.gz" HEAD deploy/operator
          tar -tzf "dist/operator-kit-$v.tar.gz"

      - name: Upload the operator kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-kit
          path: dist/

  # The sums are named SHA256SUMS.txt, with SHA256SUMS.txt.cosign.bundle beside
  # them: the PulseEngine release standard, and the only names varve's layer
  # deposit looks for. Under any other name the pulseengine realm cannot carry
  # warte. The SBOM is summed too, so the signature covers it.
  checksums:
    name: Generate SHA256SUMS.txt
    needs: [build, sbom, operator-kit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          test -s sbom.json
          test -s operator-kit-*.tar.gz
          sha256sum warte-* sbom.json operator-kit-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Pinned: the unpinned install picked up a release without --output-file
      # and failed v1.3.1's release run (tests/ci_workflows.rs checks pins).
      - name: Install cargo-cyclonedx
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom
          test -s sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json

  sign:
    name: Sign with cosign
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign SHA256SUMS.txt
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.txt.cosign.bundle dist/SHA256SUMS.txt

      - name: Upload signature
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: dist/SHA256SUMS.txt.cosign.bundle

  # SLSA build provenance for every binary, so `gh attestation verify
  # warte-<version>-<platform> --repo pulseengine/warte` answers for each one.
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "dist/warte-*"

  release:
    name: Create GitHub release
    needs: [build, checksums, sbom, sign, attest, operator-kit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-artifacts/warte-*
            release-artifacts/SHA256SUMS.txt
            release-artifacts/sbom.json
            release-artifacts/operator-kit-*.tar.gz
            release-artifacts/SHA256SUMS.txt.cosign.bundle
          fail_on_unmatched_files: true
          generate_release_notes: true
