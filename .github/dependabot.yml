version: 2
# Grouped monthly updates (fleet template, owner decision 2026-11-21).
# One entry per ecosystem, its directories in one `directories:` list. Every
# entry runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open, and waits
# 7 days after a release (cooldown). Lockstep groups come first because
# Dependabot puts a dependency in the FIRST group it matches; then one
# minor-patch group. Majors stay ungrouped, one PR each, so a breaking change
# is read on its own. Security updates ignore the schedule and the limit.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    ignore:
      # relay-ccsds and relay-sec are pinned to one relay commit so the
      # telemetry wire format stays unchanged (DD-SMITHY-001); moved by hand.
      - dependency-name: "relay-*"
      # quinn is pinned exactly (transport v2, #41); moved by hand.
      - dependency-name: "quinn"
    groups:
      # axum fixes the tower and tower-http versions it accepts.
      axum-stack:
        patterns:
          - "axum"
          - "tower"
          - "tower-http"
      # one rustls version across the TLS stack.
      rustls-stack:
        patterns:
          - "rustls"
          - "tokio-rustls"
          - "rcgen"
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directories:
      - /tests/playwright
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
